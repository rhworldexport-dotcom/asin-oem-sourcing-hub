<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop - Sourcing Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        
        :root {
            --apple-bg: #ffffff;
            --apple-text: #1d1d1f;
            --apple-blue: #0066cc;
            --emerald: #10b981;
            --card: #f5f5f7;
        }

        body { 
            background-color: var(--apple-bg); 
            color: var(--apple-text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple Style Header */
        .glass-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 120px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* Large Grid */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr; /* On passe sur une colonne large pour les photos */
            gap: 25px;
            padding: 20px;
        }

        .apple-card {
            background: var(--card);
            border-radius: 35px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border: 1px solid rgba(0,0,0,0.02);
            text-align: center;
        }

        .apple-card:active { transform: scale(0.97); }

        .img-wrap {
            height: 250px; /* Photos beaucoup plus grandes */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        /* Navigation */
        .nav-bar {
            position: fixed;
            bottom: 30px; left: 24px; right: 24px;
            height: 75px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(30px);
            border-radius: 38px;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 2000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .nav-item { color: #555; font-size: 22px; transition: all 0.3s; }
        .nav-item.active { color: #fff; transform: scale(1.1); }

        .modal-view {
            position: fixed;
            inset: 0; background: #fff;
            z-index: 5000;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        .modal-active { transform: translateY(0); }

        .price-text { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--apple-blue); }

        .sa-panel { background: #fbfbfd; border-radius: 30px; padding: 25px; border: 1px solid #f2f2f2; }
        .data-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #efeff4; }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pt-[140px] pb-40">

    <div class="glass-header">
        <div class="flex justify-between items-center w-full">
            <div>
                <p class="text-[10px] font-black tracking-[0.6em] uppercase opacity-30 mb-1">Maison Accio</p>
                <h1 class="text-3xl font-extrabold tracking-tighter italic">Worldshop</h1>
            </div>
            <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center shadow-xl">
                <i class="fas fa-crown text-white text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Search Area -->
    <div class="px-8 mb-8">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 opacity-30"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="Rechercher ASIN ou Produit..." class="w-full bg-[#f5f5f7] border-none rounded-2xl pl-14 py-5 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
    </div>

    <!-- Product Feed -->
    <div id="gemGrid" class="product-grid">
        <!-- 30 Large Cards -->
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div class="flex justify-between items-center mb-10">
            <div onclick="closeModal()" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-xl"><i class="fas fa-times"></i></div>
            <div id="modalFav" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-xl" onclick="toggleFavoriteCurrent()"><i class="far fa-heart"></i></div>
        </div>

        <div class="text-center mb-12">
            <div class="img-wrap h-80 mb-8">
                <img id="modalImg" src="" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'">
            </div>
            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-black px-4 py-1.5 rounded-full mb-4 inline-block uppercase">✓ Verified OEM Supplier</span>
            <h2 id="modalName" class="text-3xl font-extrabold leading-tight mb-2 tracking-tighter italic">---</h2>
            <p id="modalAsin" class="text-2xl font-black text-blue-600 tracking-tighter mb-8">---</p>
        </div>

        <div class="sa-panel mb-10">
            <div class="data-row"><span class="text-slate-400">Prix de Vente</span><span id="modalPrice" class="price-text">--€</span></div>
            <div class="data-row"><span class="text-slate-400">Rank BSR</span><span id="modalRank" class="font-bold">---</span></div>
            <div class="data-row"><span class="text-slate-400">Ventes/mo</span><span id="modalSales" class="font-bold text-emerald-600">---</span></div>
            <div class="data-row"><span class="text-slate-400">Sellers FBA</span><span id="modalFBA" class="font-bold text-blue-500">---</span></div>
            <div class="data-row border-none"><span class="text-slate-400">Sellers FBM</span><span id="modalFBM" class="font-bold text-orange-500">---</span></div>
        </div>

        <!-- Profit Sim -->
        <div class="bg-black text-white p-10 rounded-[50px] mb-10 shadow-2xl">
            <div class="flex justify-between items-center mb-10">
                <p class="text-[10px] font-black uppercase text-slate-500">Simulateur de Profit</p>
                <div class="flex gap-3">
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-1">QTÉ</span><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-16 bg-white/10 rounded-xl p-2 text-center font-black"></div>
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-1">ACHAT €</span><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-16 bg-white/10 rounded-xl p-2 text-center font-black text-emerald-400"></div>
                </div>
            </div>
            <div class="flex justify-between items-end mb-10">
                <div><p class="text-[10px] opacity-40 mb-1">C.A TOTAL</p><p id="simCA" class="text-3xl font-black italic">--€</p></div>
                <div class="text-right"><p class="text-[10px] text-emerald-400 mb-1 font-bold">PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-emerald-400 italic">--€</p></div>
            </div>
            <div class="border-t border-white/10 pt-8 flex gap-4">
                <a id="amazonLink" target="_blank" class="flex-grow bg-white text-black h-16 rounded-2xl flex items-center justify-center gap-2 font-black text-[10px] uppercase shadow-xl"><i class="fab fa-amazon text-orange-500"></i> Amazon</a>
                <a id="supplierLink" target="_blank" class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center"><i class="fas fa-industry text-xl"></i></a>
            </div>
        </div>

        <button onclick="prepareDirectEmail()" class="w-full h-20 rounded-[30px] bg-blue-600 text-white font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Submit Worldshop Inquiry</button>
    </div>

    <!-- Nav Bar -->
    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top:150, behavior:'smooth'})" class="nav-item"><i class="fas fa-search-plus"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        let allGems = [];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_final_luxe') || '[]');

        document.addEventListener('DOMContentLoaded', loadGems);

        async function loadGems() {
            const res = await fetch('/daily-gems.json');
            allGems = await res.json();
            renderGrid(allGems);
        }

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach((gem, i) => {
                const isFav = favorites.includes(gem.asin);
                grid.innerHTML += `
                    <div class="apple-card" onclick="openDetails('${gem.asin}')">
                        <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'"></div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-1">${gem.name}</h3>
                        <p class="price-text">${gem.price}€</p>
                        <div class="flex justify-center gap-4 mt-3 opacity-30 text-[10px] font-black uppercase">
                            <span>${gem.sales} V/M</span>
                            <span>Rank ${gem.rank}</span>
                        </div>
                    </div>`;
            });
        }

        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin);
            if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalRank').innerText = activeGem.rank;
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('modalFBA').innerText = activeGem.fba || "8";
            document.getElementById('modalFBM').innerText = activeGem.fbm || "5";
            document.getElementById('modalROI').innerText = activeGem.roi;
            
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin.trim();
            document.getElementById('supplierLink').href = "https://www.alibaba.com/showroom/oem-manufacturer-" + activeGem.asin + ".html";

            updateSim();
            updateModalFavIcon();
            document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }

        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        
        function toggleFavoriteCurrent() {
            const asin = activeGem.asin;
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_final_luxe', JSON.stringify(favorites));
            updateModalFavIcon();
            renderGrid(allGems);
        }

        function updateModalFavIcon() {
            const icon = document.querySelector('#modalFav i');
            icon.className = favorites.includes(activeGem.asin) ? 'fas fa-heart text-red-500' : 'far fa-heart';
        }

        function filterGems() {
            const query = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(query) || g.asin.toLowerCase().includes(query)));
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'home') { document.getElementById('navHome').classList.add('active'); renderGrid(allGems); }
            if(view === 'fav') { document.getElementById('navFav').classList.add('active'); renderGrid(allGems.filter(g => favorites.includes(g.asin))); }
        }

        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. We are looking for an OEM to supply ${activeGem.name} (Target ASIN: ${activeGem.asin}). It MUST be identical to this model: Amazon Link: ${amzLink} ...`;
            window.location.href = `mailto:mark@feyongusb.com?subject=OEM Sourcing Inquiry - ${activeGem.asin}&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
