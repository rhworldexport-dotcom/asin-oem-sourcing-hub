<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Elite - Sourcing Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        :root { --apple-text: #1d1d1f; --apple-blue: #0071e3; --sa-green: #27ae60; --sa-orange: #e67e22; --bg-light: #f5f5f7; }
        body { background-color: #ffffff; color: var(--apple-text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        .apple-nav { position: fixed; top: 0; left: 0; right: 0; height: 110px; background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px); z-index: 1000; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 0 24px 15px 24px; }
        .hero-title { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; text-align: center; margin-top: 140px; margin-bottom: 40px; color: #000; }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .gem-card { background: #ffffff; border-radius: 24px; padding: 15px; border: 1px solid #f1f1f1; position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .gem-card:active { transform: scale(0.96); }
        .img-wrap { height: 160px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 15px; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .fav-icon { position: absolute; top: 15px; right: 15px; font-size: 16px; color: #ccc; z-index: 10; transition: color 0.3s; }
        .fav-active { color: #ff3b30 !important; }

        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        
        .sa-table { width: 100%; margin-bottom: 25px; border-radius: 20px; overflow: hidden; border: 1px solid #f2f2f2; }
        .sa-row { border-bottom: 1px solid #f2f2f2; display: flex; justify-content: space-between; padding: 14px 20px; align-items: center; }
        .sa-label { font-size: 13px; font-weight: 500; color: #86868b; }
        .sa-val { font-size: 15px; font-weight: 700; color: #1d1d1f; }
        .sa-header { background: #fbfbfd; padding: 12px 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #86868b; letter-spacing: 1px; }

        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.9); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .nav-item { color: #555; font-size: 22px; cursor: pointer; }
        .nav-item.active { color: #fff; transform: scale(1.1); }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">

    <nav class="apple-nav">
        <div>
            <p class="text-[10px] font-black tracking-[0.4em] uppercase opacity-30 mb-1">Maison Accio</p>
            <h1 class="text-xl font-black italic tracking-tighter">WORLDSHOP.</h1>
        </div>
        <div onclick="location.reload()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-xs opacity-60"><i class="fas fa-sync-alt"></i></div>
    </nav>

    <h1 class="hero-title">Sourcing<br><span style="color:var(--apple-blue)">Intelligence.</span></h1>

    <!-- Search Area -->
    <div class="px-8 mb-10">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 opacity-30 text-sm"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="Rechercher par ASIN ou Nom..." class="w-full bg-[#f5f5f7] border-none rounded-2xl pl-14 py-4 text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-4" id="gemGrid">
        <!-- 30 Products Injected -->
    </div>

    <!-- SellerAmp Dashboard Modal -->
    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div class="flex justify-between items-center mb-10">
            <div onclick="closeModal()" class="w-12 h-12 rounded-2xl bg-gray-100 flex items-center justify-center text-xl active:scale-90 transition-transform"><i class="fas fa-chevron-left text-slate-400"></i></div>
            <span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-4 py-1.5 rounded-lg uppercase tracking-widest">✓ Verified OEM Match</span>
        </div>

        <div class="flex flex-col items-center mb-12 text-center">
            <img id="modalImg" src="" class="w-48 h-48 object-contain bg-white p-4 border border-gray-100 rounded-[40px] shadow-2xl mb-8">
            <h2 id="modalName" class="text-2xl font-extrabold leading-tight mb-2 tracking-tight italic uppercase">---</h2>
            <p id="modalAsin" class="text-3xl font-black text-blue-600 tracking-tighter mb-8">---</p>
            
            <div class="grid grid-cols-2 gap-4 w-full">
                <a id="amazonLink" target="_blank" class="bg-black text-white h-16 rounded-2xl flex items-center justify-center gap-3 font-black text-[11px] uppercase shadow-xl active:scale-95 transition-transform"><i class="fab fa-amazon text-orange-400"></i> Amazon.fr</a>
                <a id="supplierLink" target="_blank" class="bg-slate-50 text-black h-16 rounded-2xl flex items-center justify-center gap-3 border border-slate-100 shadow-inner active:scale-95 transition-transform"><i class="fas fa-industry"></i> Usine OEM</a>
            </div>
        </div>

        <!-- SellerAmp Data -->
        <div class="sa-header">SellerAmp Analysis (Real-Time)</div>
        <div class="sa-table">
            <div class="sa-row"><span class="sa-label">Amazon Price</span><span id="modalPrice" class="sa-val text-blue-600 text-lg">--€</span></div>
            <div class="sa-row"><span class="sa-label">BSR Rank</span><span id="modalRank" class="sa-val font-black">---</span></div>
            <div class="sa-row"><span class="sa-label">Ventes / Mois</span><span id="modalSales" class="sa-val text-emerald-600">---</span></div>
            <div class="sa-row" style="background:#e8f5e9"><span class="sa-label text-green-800">ROI Expected</span><span id="modalROI" class="sa-val text-green-600 text-lg">--%</span></div>
        </div>

        <!-- Calculator -->
        <div class="sa-header">Calculateur de Profit</div>
        <div class="bg-slate-50 p-8 rounded-[45px] mb-10 border border-slate-100 shadow-sm">
            <div class="grid grid-cols-2 gap-6 mb-8">
                <div class="flex flex-col gap-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Quantité</span>
                    <input type="number" id="simQty" value="100" oninput="updateSim()" class="w-full bg-white border border-slate-100 rounded-xl p-4 text-center font-black text-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Achat (€)</span>
                    <input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-full bg-white border border-slate-100 rounded-xl p-4 text-center font-black text-lg text-green-600 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[10px] font-black text-gray-400 mb-1 uppercase tracking-tighter"><i class="fas fa-shopping-cart mr-1"></i>C.A RECAP</p><p id="simCA" class="text-3xl font-black italic tracking-tighter">--€</p></div>
                <div class="text-right"><p class="text-[10px] font-black text-green-600 mb-1 uppercase tracking-widest"><i class="fas fa-wallet mr-1"></i>PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-green-600 italic tracking-tighter">--€</p></div>
            </div>
        </div>

        <button onclick="prepareDirectEmail()" class="w-full h-22 rounded-[30px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Submit Worldshop Inquiry</button>
        <button onclick="closeModal()" class="w-full mt-10 text-slate-400 text-[10px] font-bold uppercase tracking-widest">Fermer</button>
    </div>

    <!-- Navigation -->
    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item"><i class="fas fa-chart-line"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        let allGems = [];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_pro_favs_vFinal') || '[]');

        document.addEventListener('DOMContentLoaded', loadGems);

        async function loadGems() {
            try {
                const res = await fetch('/daily-gems.json');
                allGems = await res.json();
                renderGrid(allGems);
            } catch(e) { console.error(e); }
        }

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach((gem) => {
                const isFav = favorites.includes(gem.asin);
                grid.innerHTML += `
                    <div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                        <i class="${isFav ? 'fas text-red-500' : 'far'} fa-heart fav-icon" onclick="event.stopPropagation(); toggleFavorite('${gem.asin}', this)"></i>
                        <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300'"></div>
                        <h3 class="text-[11px] font-bold text-gray-500 truncate mb-1 uppercase tracking-tight">${gem.name}</h3>
                        <p class="text-[16px] font-black text-blue-600">${gem.price}€</p>
                        <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">ASIN: ${gem.asin}</p>
                    </div>`;
            });
        }

        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin);
            if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalRank').innerText = activeGem.rank;
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('modalROI').innerText = activeGem.roi;
            
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin.trim();
            document.getElementById('supplierLink').href = activeGem.supplierUrl;

            updateSim();
            document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }

        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        
        function filterGems() {
            const q = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(q) || g.asin.toLowerCase().includes(q)));
        }

        function toggleFavorite(asin, el) {
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_pro_favs_vFinal', JSON.stringify(favorites));
            el.classList.toggle('fas'); el.classList.toggle('far'); el.classList.toggle('text-red-500');
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'home') { document.getElementById('navHome').classList.add('active'); renderGrid(allGems); }
            if(view === 'fav') { document.getElementById('navFav').classList.add('active'); renderGrid(allGems.filter(g => favorites.includes(g.asin))); }
        }

        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello,\n\nThis is Mr. HOMY from Worldshop. We are looking for an Original Equipment Manufacturer (OEM) to supply ${activeGem.name} (Target ASIN: ${activeGem.asin}).\n\nWe require the Generic version (Neutral packaging, no branding on product) that matches original factory specifications for the Amazon market. We have experience with high-quality partners like Shenzhen Xinshengyang and demand "Zero Return" quality.\n\nOur Order Strategy:\n1. Initial test order of ${document.getElementById('simQty').value} units minimum for quality check.\n2. Transition to weekly recurring orders once the quality standard is met.\n\nQuestions:\n- Do you manufacture this exact generic model?\n- Can you provide real photos of the product and its packaging?\n- What is your best unit price for ${document.getElementById('simQty').value} units?\n\nBest regards,\n\nMr. HOMY\nWorldshop Company\nWhatsApp: +33642131515\nEmail: rh.worldexport@gmail.com`;
            
            window.location.href = `mailto:contact@factory.com?subject=Inquiry for OEM Sample - Worldshop Sourcing&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
