<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Elite Supreme Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --sandisk-red: #ed1c24; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .hero-header { height: 260px; background: #000; position: relative; border-radius: 0 0 50px 50px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; filter: contrast(1.2); }
        .hero-title { font-size: 38px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; }
        .cat-pill { flex: 0 0 auto; padding: 12px 22px; background: #fff; border-radius: 25px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1.5px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        .cat-pill.brand-hub { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
        .gem-card { background: #ffffff; border-radius: 35px; padding: 22px; border: 2.5px solid transparent; position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .card-gaming { border-color: #e0f2fe; border-width: 2px; } .card-auto { border-color: #fef3c7; border-width: 2px; } .card-cuisine { border-color: #d1fae5; border-width: 2px; } .card-storage { border-color: #fecaca; border-width: 2px; }
        .img-wrap { height: 130px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 15px; }
        .product-img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; }
        .nav-item { color: #666; font-size: 22px; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-header shadow-2xl">

        </div>
        <div class="text-center mb-12">

            <h2 id="modalName" class="text-2xl font-black italic leading-tight mb-2 tracking-tight uppercase">---</h2>
            <p id="modalAsin" class="text-3xl font-black text-blue-600 tracking-tighter mb-10">---</p>
            <div class="grid grid-cols-2 gap-5">

                <a id="supplierLink" target="_blank" class="bg-slate-50 text-black h-18 rounded-[35px] flex items-center justify-center gap-3 border border-slate-200 shadow-inner font-black text-[11px] uppercase"><i class="fas fa-industry text-blue-600"></i> Usine OEM</a>
            </div>
        </div>
        <div class="bg-slate-50 rounded-[45px] p-8 mb-8 border border-slate-100">
            <div class="flex justify-between py-4 border-b border-slate-200"><span class="text-[11px] font-bold text-slate-500 uppercase">Prix Amazon</span><span id="modalPrice" class="font-black text-blue-600 text-xl">--€</span></div>
            <div class="flex justify-between py-4 border-b border-slate-200"><span class="text-[11px] font-bold text-slate-500 uppercase">Ventes/Mois</span><span id="modalSales" class="font-black text-emerald-600 text-lg">---</span></div>
            <div class="flex justify-between py-4"><span class="text-[11px] font-bold text-slate-500 uppercase">BSR Rank</span><span id="modalRank" class="font-black text-slate-800 text-lg">---</span></div>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-24 rounded-[40px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-2xl">Lancer Stratégie Worldshop</button>
    </div>

    <nav class="nav-bar">

        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item"><i class="fas fa-crown text-blue-600"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

            {"asin":"B09X7BQB4J","cat":"Stockage","name":"SanDisk Extreme 128GB","price":34.00,"sales":1100,"rank":106,"imageUrl":"https://m.media-amazon.com/images/I/51jolRaoHqL.jpg","vendor":"hctdtech"},
            {"asin":"B0BFH76ZCX","cat":"Stockage","name":"SanDisk Ultra Chromebook","price":26.90,"sales":500,"rank":225,"imageUrl":"https://m.media-amazon.com/images/I/41T8v+s8ZzL.jpg","vendor":"ldcems"},
            {"asin":"B09X7DNF6G","cat":"Stockage","name":"SanDisk Extreme PRO SD","price":44.69,"sales":600,"rank":155,"imageUrl":"https://m.media-amazon.com/images/I/61o8OmUS-iL.jpg","vendor":"kissin"},
            {"asin":"B07YGZ7JD5","cat":"Stockage","name":"Kingston Canvas Plus 128G","price":23.49,"sales":1500,"rank":100,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"oscoousb"}
        ];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem, idx) => {
                const isFav = favorites.includes(gem.asin);
                const colorMap = { 'Gaming': 'card-gaming', 'Auto': 'card-auto', 'Cuisine': 'card-cuisine', 'Stockage': 'card-storage' };
                grid.innerHTML += `<div class="gem-card ${colorMap[gem.cat]} animate-reveal" onclick="openDetails('${gem.asin}')">
                    <i class="${isFav?'fas text-red-500':'far'} fa-heart absolute top-4 right-4" onclick="event.stopPropagation();toggleFav('${gem.asin}',this)"></i>
                    <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589174.png'"></div>
                    <h3 class="text-[10px] font-black text-slate-400 truncate mb-2 uppercase tracking-tighter">${gem.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-[18px] font-black text-blue-600">${gem.price}€</span><span class="text-[8px] bg-slate-50 px-2 py-1 rounded-md font-bold text-slate-400">${gem.sales} V/M</span></div>
                </div>`;
            });
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'Stockage'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin); if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin;
            document.getElementById('supplierLink').href = "https://" + activeGem.vendor + ".en.alibaba.com/productlist.html";
            document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function toggleFav(asin, el) {
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_favs', JSON.stringify(favorites));
            el.classList.toggle('fas'); el.classList.toggle('far'); el.classList.toggle('text-red-500');
        }
        function switchView(view) { if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'Stockage')); }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${activeGem.asin}. Amazon Link: ${amzLink}. Best regards, Mr. HOMY (+33642131515)`;
            window.location.href = `mailto:sales@factory.com?subject=OEM Inquiry - ASIN ${activeGem.asin}&body=${encodeURIComponent(body)}`;
        }
        renderGrid(allGems.filter(g => g.cat !== 'Stockage'));
    </script>
