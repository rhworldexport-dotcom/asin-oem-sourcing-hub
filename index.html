<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Elite - Sourcing Supreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --sa-green: #27ae60; --gold: #c5a059; }
        body { background-color: #ffffff; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .hero-header { height: 260px; background: #000; position: relative; border-radius: 0 0 50px 50px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; filter: contrast(1.1); }
        .hero-title { font-size: 38px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; }
        .cat-pill { flex: 0 0 auto; padding: 12px 24px; background: #f5f5f7; border-radius: 25px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; display: flex; align-items: center; gap: 8px; color: #86868b; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        .cat-pill.brand-hub { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
        .gem-card { background: #ffffff; border-radius: 32px; padding: 22px; border: 2px solid #f2f2f2; position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .gem-card:active { transform: scale(0.95); border-color: var(--apple-blue); }
        .img-wrap { height: 130px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 15px; border-radius: 20px; overflow: hidden; }
        .product-img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .nav-item { color: #666; font-size: 22px; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-header shadow-2xl">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800" class="hero-img">
        <div class="relative z-10">
            <span class="bg-blue-600 text-white text-[9px] font-black px-4 py-1.5 rounded-full uppercase mb-4 inline-block tracking-widest shadow-xl italic">Sourcing Elite Hub</span>
            <h1 class="hero-title">Worldshop<br><span style="color:var(--apple-blue)">Diamond.</span></h1>
        </div>
    </div>

    <div class="mt-10 px-6">
        <div class="flex gap-3 overflow-x-auto pb-6 no-scrollbar" id="catBar">
            <div class="cat-pill active" onclick="filterCat('all', this)">30 Pépites</div>
            <div class="cat-pill brand-hub" onclick="filterCat('VIP', this)"><i class="fas fa-crown"></i> Hub VIP (SSD/SD)</div>
            <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
            <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
            <div class="cat-pill" onclick="filterCat('Cuisine', this)">Cuisine</div>
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-5 mt-4" id="gemGrid"></div>

    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div onclick="closeModal()" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 border mb-8"><i class="fas fa-times"></i></div>
        <div class="text-center mb-12">
            <img id="modalImg" src="" class="w-56 h-56 mx-auto object-contain bg-white p-6 border-2 border-slate-50 rounded-[50px] shadow-2xl mb-8">
            <h2 id="modalName" class="text-2xl font-black italic leading-tight mb-2 tracking-tight uppercase">---</h2>
            <p id="modalAsin" class="text-3xl font-black text-blue-600 tracking-tighter mb-10">---</p>
            <div class="grid grid-cols-2 gap-4">
                <a id="amazonLink" target="_blank" class="bg-black text-white h-16 rounded-3xl flex items-center justify-center gap-3 font-black text-[11px] uppercase shadow-xl"><i class="fab fa-amazon text-orange-400"></i> Amazon</a>
                <a id="supplierLink" target="_blank" class="bg-slate-50 text-black h-16 rounded-3xl flex items-center justify-center gap-3 border shadow-inner font-black text-[11px] uppercase"><i class="fas fa-industry text-blue-600"></i> Usine OEM</a>
            </div>
        </div>
        <div class="bg-slate-50 rounded-[40px] p-8 mb-8 border border-slate-100">
            <div class="flex justify-between py-4 border-b border-slate-100"><span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Prix Amazon</span><span id="modalPrice" class="font-black text-blue-600 text-lg">--€</span></div>
            <div class="flex justify-between py-4 border-b border-slate-100"><span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Ventes/Mois</span><span id="modalSales" class="font-black text-emerald-600">---</span></div>
            <div class="flex justify-between py-4"><span class="text-xs font-bold text-slate-500 uppercase tracking-widest">BSR Rank</span><span id="modalRank" class="font-black text-slate-800">---</span></div>
        </div>
        <div class="bg-black text-white rounded-[50px] p-10 mb-8 shadow-3xl">
            <div class="grid grid-cols-2 gap-6 mb-10">
                <div><p class="text-[9px] font-black text-slate-500 uppercase mb-3">Quantité</p><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-2xl p-4 text-center font-black text-xl"></div>
                <div><p class="text-[9px] font-black text-slate-500 uppercase mb-3">Achat €</p><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-2xl p-4 text-center font-black text-xl text-emerald-400"></div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[10px] font-black text-slate-500 mb-2 uppercase">C.A Total</p><p id="simCA" class="text-3xl font-black italic tracking-tighter">--€</p></div>
                <div class="text-right"><p class="text-[10px] font-black text-emerald-400 mb-2 uppercase">Profit Net</p><p id="simProfit" class="text-4xl font-black text-emerald-400 italic tracking-tighter">--€</p></div>
            </div>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-22 rounded-[35px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Lancer Stratégie Worldshop</button>
    </div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-layer-group"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item"><i class="fas fa-crown text-blue-500"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            // GAMING (10 UNIQUE)

            {"asin":"B07GS6ZB7T","cat":"Gaming","name":"Logitech G502 HERO Mouse","price":39.47,"sales":2100,"rank":31,"imageUrl":"https://m.media-amazon.com/images/I/61mpMH5TzkL.jpg","factory":"easterntimes"},
            // AUTO (10 UNIQUE)
            {"asin":"B07QC6BVVW","cat":"Auto","name":"Autel AP200 Bluetooth","price":69.00,"sales":600,"rank":4853,"imageUrl":"https://m.media-amazon.com/images/I/61b17LdIsHL.jpg","factory":"autel"},

            {"asin":"B07QR4Q63Z","cat":"Auto","name":"AstroAI Air Compressor","price":45.99,"sales":1800,"rank":540,"imageUrl":"https://m.media-amazon.com/images/I/71aqvjpTNIL.jpg","factory":"yyliuyang"},
            {"asin":"B00SP4PF04","cat":"Auto","name":"Digital Tire Pressure Gauge","price":12.99,"sales":2200,"rank":340,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","factory":"yyliuyang"},
            {"asin":"B085DMCH6S","cat":"Auto","name":"Lamicall Phone Mount Moto","price":19.99,"sales":1500,"rank":670,"imageUrl":"https://m.media-amazon.com/images/I/71Kx8V6U9rL.jpg","factory":"lamicall"},
            {"asin":"B07XJ1N4W2","cat":"Auto","name":"Favoto Motorcycle Cover","price":34.50,"sales":400,"rank":1100,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","factory":"mei-ao"},
            {"asin":"B01N10S80B","cat":"Auto","name":"Expandable Cable Sleeve","price":16.50,"sales":2200,"rank":34,"imageUrl":"https://m.media-amazon.com/images/I/71qS6eH7GRL.jpg","factory":"wellcoint"},
            {"asin":"B00O9S01A8","cat":"Auto","name":"Veepeak Mini OBD2 Blue","price":24.50,"sales":1400,"rank":120,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","factory":"konnwei"},
            {"asin":"B07Y8S6S5S","cat":"Auto","name":"Backseat Car Organizer","price":22.90,"sales":900,"rank":850,"imageUrl":"https://m.media-amazon.com/images/I/71hj0Lp5C-L.jpg","factory":"hzguard"},
            // CUISINE (10 UNIQUE)
            {"asin":"B0113UZJE2","cat":"Cuisine","name":"Etekcity Digital Scale","price":18.99,"sales":2500,"rank":1422,"imageUrl":"https://m.media-amazon.com/images/I/71S-9VUpURL.jpg","factory":"camry"},
            {"asin":"B0DFM1JHJS","cat":"Cuisine","name":"Tefal Optiss Scale","price":22.90,"sales":800,"rank":434,"imageUrl":"https://m.media-amazon.com/images/I/51r2zB4KURL.jpg","factory":"tefal"},
            {"asin":"B00XN247V2","cat":"Cuisine","name":"ThermoPro Meat Thermometer","price":14.50,"sales":3500,"rank":5,"imageUrl":"https://m.media-amazon.com/images/I/71W7xwOF9oL.jpg","factory":"szecare"},
            {"asin":"B076F3C185","cat":"Cuisine","name":"Bonsenkitchen Frother","price":12.50,"sales":2200,"rank":34,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","factory":"hssunway"},
            {"asin":"B089K8L6N3","cat":"Cuisine","name":"Joseph Joseph Garlic Press","price":18.99,"sales":1500,"rank":12,"imageUrl":"https://m.media-amazon.com/images/I/61TeqxNQwVL.jpg","factory":"wylemeng"},
            {"asin":"B088K8ZMXQ","cat":"Cuisine","name":"Salad Spinner 4-in-1","price":34.00,"sales":890,"rank":120,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","factory":"zgshuangma"},
            {"asin":"B01F58S948","cat":"Cuisine","name":"Digital Measuring Spoon","price":12.99,"sales":890,"rank":1245,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","factory":"qjscale"},
            {"asin":"B07PTNZT75","cat":"Cuisine","name":"Kitchen Scale Stainless","price":11.99,"sales":3000,"rank":70,"imageUrl":"https://m.media-amazon.com/images/I/71hj0Lp5C-L.jpg","factory":"zswhitebird"},
            {"asin":"B01LXO8T93","cat":"Cuisine","name":"Milk Frother Elite","price":12.50,"sales":2200,"rank":34,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","factory":"cnxyydz"},
            {"asin":"B0098S8W5E","cat":"Cuisine","name":"Magnetic Kitchen Timer","price":8.99,"sales":1200,"rank":540,"imageUrl":"https://m.media-amazon.com/images/I/61oE1NouXuL.jpg","factory":"loease"},
            // HUB VIP (SSD/SD)
            {"asin":"B0B7NTY2S6","cat":"VIP","name":"SanDisk Ultra 128GB SD","price":24.99,"sales":2500,"rank":2,"imageUrl":"https://m.media-amazon.com/images/I/71Ow-Ih7KNL.jpg","factory":"kissin"},
            {"asin":"B0DCW8FKK9","cat":"VIP","name":"SanDisk Ultra Go Dual USB","price":26.99,"sales":1000,"rank":2,"imageUrl":"https://m.media-amazon.com/images/I/71UkwcNaIvL.jpg","factory":"usky"},
            {"asin":"B07NY23WBG","cat":"VIP","name":"SanDisk High Endurance SD","price":34.49,"sales":1200,"rank":19,"imageUrl":"https://m.media-amazon.com/images/I/619qRoAFthL.jpg","factory":"oscoousb"},
            {"asin":"B0C8HHFX3C","cat":"VIP","name":"Kingston NV2 1TB SSD","price":75.00,"sales":1800,"rank":215,"imageUrl":"https://m.media-amazon.com/images/I/516+2Z7S2cL.jpg","factory":"szjtcc"},
            {"asin":"B099684C5G","cat":"VIP","name":"Samsung 990 PRO 1TB SSD","price":115.00,"sales":3500,"rank":1,"imageUrl":"https://m.media-amazon.com/images/I/616684C5G.jpg","factory":"samsung-oem"}
        ];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const isFav = favorites.includes(gem.asin);
                grid.innerHTML += `<div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                    <i class="${isFav?'fas text-red-500':'far'} fa-heart absolute top-4 right-4" onclick="event.stopPropagation();toggleFav('${gem.asin}',this)"></i>
                    <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589174.png'"></div>
                    <h3 class="text-[10px] font-black text-slate-400 truncate mb-1 uppercase tracking-tighter">${gem.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-[18px] font-black text-blue-600">${gem.price}€</span><span class="text-[8px] bg-slate-50 px-2 py-1 rounded-md font-bold text-slate-400">${gem.sales} V/M</span></div>
                </div>`;
            });
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin); if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('modalRank').innerText = "#" + activeGem.rank;
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin;
            document.getElementById('supplierLink').href = "https://" + activeGem.factory + ".en.alibaba.com/productlist.html";
            updateSim(); document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function toggleFav(asin, el) {
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_favs', JSON.stringify(favorites));
            el.classList.toggle('fas'); el.classList.toggle('far'); el.classList.toggle('text-red-500');
        }
        function switchView(view) { if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'VIP')); }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${activeGem.asin}. Amazon Link: ${amzLink}. Best regards, Mr. HOMY (+33642131515)`;
            window.location.href = `mailto:sales@factory.com?subject=OEM Inquiry - ASIN ${activeGem.asin}&body=${encodeURIComponent(body)}`;
        }
        renderGrid(allGems.filter(g => g.cat !== 'VIP'));
    </script>
</body>
</html>
