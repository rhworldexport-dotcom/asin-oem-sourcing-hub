<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop - Sourcing Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        body { background-color: #ffffff; color: #111; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
        .hero-banner { background: #000; height: 420px; position: relative; display: flex; align-items: flex-end; padding: 40px 30px; border-radius: 0 0 60px 60px; overflow: hidden; }
        .hero-banner img { position: absolute; inset: 0; width:100%; height:100%; object-fit: cover; opacity: 0.5; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: 45px; line-height: 1; color: white; position: relative; z-index: 10; }
        .gem-card { background: #fff; border-radius: 30px; overflow: hidden; border: 1px solid #f1f1f1; box-shadow: 0 10px 30px rgba(0,0,0,0.03); cursor: pointer; transition: transform 0.2s; }
        .img-container { height: 220px; background: #fdfdfd; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-sheet { background: white; border-radius: 50px 50px 0 0; position: fixed; inset: 0; z-index: 9999; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; padding-bottom: 50px; }
        .modal-active { transform: translateY(0); }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 25px; height: 75px; background: #000; border-radius: 40px; display: flex; justify-content: space-around; align-items: center; z-index: 5000; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .nav-item { color: #555; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #fff; transform: scale(1.1); }
        .sa-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; font-weight: 700; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-banner shadow-2xl">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1200&q=80">
        <div class="hero-content">
            <span class="bg-emerald-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Premium Selection</span>
            <h1 class="hero-title italic mt-4">Sourcing<br>Intelligence.</h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Worldshop Edition • 30 items</p>
        </div>
    </div>

    <div class="px-8 mt-12">
        <div class="relative mb-12">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="Rechercher ASIN ou Niche..." class="w-full bg-slate-50 border-none rounded-2xl pl-14 pr-4 py-5 text-sm focus:ring-2 focus:ring-black shadow-inner">
        </div>
        <div id="gemGrid" class="grid grid-cols-2 gap-6"></div>
    </div>

    <!-- Modal Dossier Expert -->
    <div id="dossierModal" class="modal-sheet p-8">
        <div class="w-12 h-1.5 bg-slate-100 rounded-full mx-auto mb-10" onclick="closeModal()"></div>
        <div class="flex flex-col gap-6 mb-10 text-center">
            <div class="h-64 flex items-center justify-center bg-slate-50 rounded-[45px] p-8 shadow-inner"><img id="modalImg" src="" class="max-h-full max-w-full object-contain"></div>
            <div>
                <span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-4 py-1.5 rounded-full mb-4 inline-block uppercase tracking-widest">✓ NO PRIVATE LABEL</span>
                <h2 id="modalName" class="text-2xl font-black leading-tight mb-2 tracking-tight uppercase italic text-slate-800">---</h2>
                <p id="modalAsin" class="text-2xl font-black text-emerald-500 mb-8 border-b pb-6">---</p>
                <div class="grid grid-cols-2 gap-4">
                    <a id="amazonLink" target="_blank" class="bg-black text-white p-5 rounded-3xl font-black text-[11px] uppercase flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all"><i class="fab fa-amazon text-orange-400"></i> Amazon</a>
                    <a id="supplierLink" target="_blank" class="bg-slate-50 text-black p-5 rounded-3xl font-black text-[11px] uppercase flex items-center justify-center gap-3 border border-slate-100"><i class="fas fa-industry"></i> Manufacture</a>
                </div>
            </div>
        </div>

        <div class="bg-slate-50 p-8 rounded-[45px] mb-10 border border-slate-100 shadow-sm">
            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest italic">Panel Expert (SellerAmp Style)</h3>
            <div class="sa-row"><span class="text-slate-400 font-normal">Amazon Price</span><span id="modalPrice">--€</span></div>
            <div class="sa-row"><span class="text-slate-400 font-normal">Rank BSR</span><span id="modalRank">---</span></div>
            <div class="sa-row"><span class="text-slate-400 font-normal">Ventes Estimées</span><span id="modalSales">---</span></div>
            <div class="sa-row border-none"><span class="text-slate-400 font-normal">ROI Garanti</span><span id="modalROI" class="text-emerald-600">--%</span></div>
        </div>

        <div class="bg-black text-white p-10 rounded-[55px] mb-10 shadow-2xl">
            <div class="flex justify-between items-center mb-10">
                <p class="text-xs font-black uppercase tracking-widest text-slate-500 italic">Simulateur de Profit</p>
                <div class="flex gap-4">
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-2 uppercase">QTÉ</span><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-20 bg-white/10 border-none rounded-xl p-3 text-center font-black text-lg text-white"></div>
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-2 uppercase">ACHAT €</span><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-20 bg-white/10 border-none rounded-xl p-3 text-center font-black text-lg text-emerald-400"></div>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-tighter">C.A RECAP</p><p id="simCA" class="text-3xl font-black italic tracking-tighter">--€</p></div>
                <div class="text-right"><p class="text-[10px] font-bold text-emerald-400 mb-2 uppercase tracking-widest">PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-emerald-400 italic tracking-tighter">--€</p></div>
            </div>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-20 rounded-[35px] bg-emerald-600 text-white font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">Envoyer Demande Worldshop</button>
        <button onclick="closeModal()" class="w-full mt-10 text-slate-400 text-[11px] font-bold uppercase tracking-[0.4em]">Fermer</button>
    </div>

    <nav class="nav-bar">
        <div onclick="location.reload()" id="navHome" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 450, behavior: 'smooth'})" class="nav-item"><i class="fas fa-search-plus"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            {"name":"Hub USB-C Luxe","asin":"B08Q7KDQKP","price":"34.99","sales":1250,"roi":65,"profit":"12.40","maxCost":"10.50","rank":"#245","imageUrl":"https://m.media-amazon.com/images/I/71u9S+Y6m6L._AC_SL1500_.jpg"},
            {"name":"SSD 1TB Pro Gen4","asin":"B0C8HHFX3C","price":"75.00","sales":1400,"roi":60,"profit":"22.00","maxCost":"18.50","rank":"#215","imageUrl":"https://m.media-amazon.com/images/I/71X8kC-iGLL._AC_SL1500_.jpg"},
            {"name":"Câble Cat8 Or","asin":"B08LNWDP6V","price":"14.90","sales":3200,"roi":95,"profit":"5.50","maxCost":"3.20","rank":"#12","imageUrl":"https://m.media-amazon.com/images/I/71Uo7P7pMGL._AC_SL1500_.jpg"},
            {"name":"Souris Gaming MSI","asin":"B096Y43J5T","price":"49.00","sales":560,"roi":58,"profit":"14.20","maxCost":"12.50","rank":"#407","imageUrl":"https://m.media-amazon.com/images/I/61Xm2q5xH+L._AC_SL1500_.jpg"},
            {"name":"Support Mural Pro","asin":"B0CN3CV93T","price":"18.50","sales":890,"roi":72,"profit":"6.80","maxCost":"5.50","rank":"#107","imageUrl":"https://m.media-amazon.com/images/I/51uU8Xz5RPL._AC_SL1200_.jpg"},
            {"name":"Mousseur Lait Elite","asin":"B06K6K6K6K","price":"19.99","sales":2500,"roi":90,"profit":"7.50","maxCost":"4.20","rank":"#12","imageUrl":"https://m.media-amazon.com/images/I/61D8YyS8MML._AC_SL1500_.jpg"},
            {"name":"Balances Inox Pro","asin":"B0D3D3D3D3","price":"22.50","sales":1800,"roi":62,"profit":"8.10","maxCost":"6.00","rank":"#340","imageUrl":"https://m.media-amazon.com/images/I/61iNn3Z-9yL._AC_SL1500_.jpg"},
            {"name":"Thermomètre Viande","asin":"B0I8I8I8I8","price":"28.00","sales":1500,"roi":75,"profit":"10.50","maxCost":"7.00","rank":"#150","imageUrl":"https://m.media-amazon.com/images/I/71R2o5nK5SL._AC_SL1500_.jpg"},
            {"name":"Presse Ail Ergo","asin":"B0N3N3N3N3","price":"12.00","sales":4000,"roi":110,"profit":"5.20","maxCost":"2.50","rank":"#3","imageUrl":"https://m.media-amazon.com/images/I/615485290382-441e4d049cb5?w=400"},
            {"name":"Aspirateur Auto Pro","asin":"B0M2M2M2M2","price":"45.00","sales":1400,"roi":63,"profit":"14.20","maxCost":"11.50","rank":"#280","imageUrl":"https://m.media-amazon.com/images/I/51e5e5e5e5l?w=400"}
        ];
        
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_final_ios_fav') || '[]');

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach(gem => {
                grid.innerHTML += `<div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                    <div class="img-container"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'"></div>
                    <div class="p-6">
                        <h3 class="text-[10px] font-black truncate uppercase mb-2 text-slate-800">${gem.name}</h3>
                        <div class="flex justify-between items-center"><span class="text-emerald-600 font-black text-xl italic">${gem.price}€</span><span class="text-[9px] text-slate-400 font-bold">${gem.sales} V/M</span></div>
                    </div></div>`;
            });
        }
        function openDetails(asin) {
            const gem = allGems.find(g => g.asin === asin);
            if(!gem) return;
            activeGem = gem;
            document.getElementById('modalImg').src = gem.imageUrl;
            document.getElementById('modalName').innerText = gem.name;
            document.getElementById('modalAsin').innerText = gem.asin;
            document.getElementById('modalPrice').innerText = gem.price + "€";
            document.getElementById('modalRank').innerText = gem.rank;
            document.getElementById('modalSales').innerText = gem.sales + " / mois";
            document.getElementById('modalROI').innerText = gem.roi;
            document.getElementById('modalMaxCost').innerText = gem.maxCost + "€";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + gem.asin.trim();
            document.getElementById('supplierLink').href = "https://www.alibaba.com/showroom/oem-manufacturer-" + gem.asin + ".html";
            updateSim();
            document.getElementById('dossierModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('dossierModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function filterGems() {
            const q = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(q) || g.asin.toLowerCase().includes(q)));
        }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. It MUST be identical to this model: Amazon Link: ${amzLink} ... Best regards, Mr. HOMY`;
            window.location.href = `mailto:mark@feyongusb.com?subject=Inquiry Worldshop Sourcing&body=${encodeURIComponent(body)}`;
        }
        document.addEventListener('DOMContentLoaded', () => renderGrid(allGems));
    </script>
</body>
</html>
