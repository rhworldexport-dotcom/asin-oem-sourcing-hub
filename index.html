<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Pro - Worldwide Hub 7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --vip-red: #ff3b30; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        /* Banner Shenzhen Master HD */
        .hero-banner { height: 320px; background: #000; position: relative; border-radius: 0 0 60px 60px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.85; filter: brightness(0.7) contrast(1.2); }
        .hero-title { font-size: 40px; font-weight: 900; color: #fff; line-height: 0.9; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; text-transform: uppercase; }
        
        /* Cartes Data 7.0 avec Contours 6px 3D */
        .data-card { background: #ffffff; border-radius: 40px; padding: 28px; border: 6px solid #f2f2f2; position: relative; box-shadow: 0 20px 45px rgba(0,0,0,0.06); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 25px; }
        .data-card:active { transform: scale(0.96); }
        
        .card-gaming { border-color: #0071e3; } 
        .card-auto { border-color: #ff9f0a; }   
        .card-cuisine { border-color: #34c759; } 
        .card-vip { border-color: #ff3b30; }     
        .card-euro { border-color: #5856d6; } 

        .asin-badge { font-size: 26px; font-weight: 900; color: #1d1d1f; letter-spacing: -1.5px; }
        .sales-badge { background: #f0fdf4; color: #166534; padding: 8px 16px; border-radius: 15px; font-size: 11px; font-weight: 900; }
        
        .fav-btn { position: absolute; top: 28px; right: 28px; font-size: 32px; color: #eee; transition: 0.3s; cursor: pointer; z-index: 20; }
        .fav-active { color: var(--vip-red) !important; }
        
        .action-btn { height: 60px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; font-weight: 900; text-transform: uppercase; transition: 0.2s; }
        .btn-amz { background: #000; color: #fff; flex: 1; }
        .btn-oem { background: #f5f5f7; color: #000; border: 1px solid #eee; flex: 1.5; }
        .btn-mail { background: #0071e3; color: #fff; width: 100%; margin-top: 18px; box-shadow: 0 12px 24px rgba(0, 113, 227, 0.3); }
        
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 85px; background: rgba(0,0,0,0.96); backdrop-filter: blur(30px); border-radius: 45px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .nav-item { color: #555; font-size: 26px; cursor: pointer; } .nav-item.active { color: #fff; }
        .cat-pill { flex: 0 0 auto; padding: 12px 24px; background: #fff; border-radius: 25px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: 2px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-44">
    <div class="hero-banner">

        <div class="relative z-10">

        </div>
    </div>

    <div class="mt-8 px-6">

            <div class="cat-pill" style="background:#fee2e2" onclick="filterCat('VIP', this)"><i class="fas fa-crown"></i> Hub VIP (10)</div>
            <div class="cat-pill" style="background:#e5e7eb" onclick="filterCat('EURO', this)"><i class="fas fa-euro-sign"></i> Destockeurs Europe</div>
            <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
            <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
            <div class="cat-pill" onclick="filterCat('Cuisine', this)">Cuisine</div>
        </div>
    </div>

    <div class="px-6 space-y-10" id="gemGrid"></div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-layer-group"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item text-blue-400"><i class="fas fa-bolt"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

            // CUISINE (10)
            {"asin":"B0113UZJE2","cat":"Cuisine","name":"Etekcity Digital Scale 5kg","price":18.99,"sales":2500,"buy":6.50,"vendor":"vesync"},

            {"asin":"B088K8ZMXQ","cat":"Cuisine","name":"Salad Spinner 4-in-1 Pro","price":34.00,"sales":890,"buy":11.50,"vendor":"zgshuangma"},
            {"asin":"B01F58S948","cat":"Cuisine","name":"Digital Measuring Spoon","price":12.99,"sales":890,"buy":3.20,"vendor":"qjscale"},
            {"asin":"B07PTNZT75","cat":"Cuisine","name":"Kitchen Scale Stainless","price":11.99,"sales":3000,"buy":3.80,"vendor":"zswhitebird"},
            {"asin":"B01LXO8T93","cat":"Cuisine","name":"Milk Frother Elite Master","price":12.50,"sales":2200,"buy":3.20,"vendor":"cnxyydz"},
            {"asin":"B0098S8W5E","cat":"Cuisine","name":"Magnetic Kitchen Timer","price":8.99,"sales":1200,"buy":2.00,"vendor":"loease"}
        ];
        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const isFav = favorites.includes(gem.asin);
                const colorMap = { 'Gaming': 'card-gaming', 'Auto': 'card-auto', 'Cuisine': 'card-cuisine', 'VIP': 'card-vip', 'EURO': 'card-euro' };
                grid.innerHTML += `<div class="data-card ${colorMap[gem.cat]}">
                    <i class="fas fa-heart fav-btn ${isFav?'fav-active':''}" onclick="toggleFav('${gem.asin}', this)"></i>
                    <div class="flex justify-between items-start mb-6">
                        <div><p class="asin-badge">${gem.asin}</p><p class="text-[12px] font-black text-slate-400 uppercase truncate w-48">${gem.name}</p></div>
                        <span class="sales-badge">${gem.sales} V/M</span>
                    </div>
                    ${gem.cat === 'EURO' ? `
                        <a href="https://${gem.vendor}" target="_blank" class="action-btn btn-mail" style="margin-top:0">Accéder au Portail Grossiste</a>
                    ` : `
                        <div class="grid grid-cols-2 gap-4 mb-6 bg-slate-50 p-5 rounded-3xl">
                            <div><p class="text-[9px] font-black text-slate-400 uppercase">Prix Amazon</p><p class="text-2xl font-black text-blue-600">${gem.price}€</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-400 uppercase">Achat Max</p><p class="text-2xl font-black text-emerald-600">${gem.buy}€</p></div>
                        </div>
                        <div class="flex gap-3">
                            <a href="https://www.amazon.fr/dp/${gem.asin}" target="_blank" class="action-btn btn-amz"><i class="fab fa-amazon text-lg"></i></a>
                            <a href="https://${gem.vendor}.en.alibaba.com/productlist.html" target="_blank" class="action-btn btn-oem">Showroom</a>
                        </div>
                        <button onclick="sendMail('${gem.asin}', '${gem.name}')" class="action-btn btn-mail">Julie Email Strategy</button>
                    `}
                </div>`;
            });
        }
        function toggleFav(asin, el) {
            if(favorites.includes(asin)) {
                favorites = favorites.filter(a => a !== asin);
                el.classList.remove('fav-active');
            } else {
                favorites.push(asin);
                el.classList.add('fav-active');
            }
            localStorage.setItem('ws_favs', JSON.stringify(favorites));
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function sendMail(asin, name) {
            const amzLink = `https://www.amazon.fr/dp/${asin}`;
            const body = `Dear Julie,\n\nThank you for your reply on Alibaba. To clarify: we are looking for BOTH options to compare:\n\n1. High Copy / OEM quality using original chipsets (the one we discussed to meet our price targets).\n2. 100% Original SanDisk/Kingston/Samsung cards.\n\nProduct: ${name}\nASIN: ${asin}\nAmazon Link: ${amzLink}\n\nOur goal is to maintain a 30% margin based on our cost analysis, so competitive pricing for the OEM/High Copy with original chipsets is our priority for weekly volume (50-100 pcs).\n\nPlease also confirm the sample cost and lead time for a test batch of 10-20 units total across these models.\n\nBest regards,\nWorldshop Team\nWhatsApp: +33664231515`;
            window.location.href = `mailto:julie@factory.com?subject=OEM Inquiry - ASIN ${asin}&body=${encodeURIComponent(body)}`;
        }
        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'home') { document.getElementById('navHome').classList.add('active'); renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO')); }
            if(view === 'fav') { document.getElementById('navFav').classList.add('active'); renderGrid(allGems.filter(g => favorites.includes(g.asin))); }
        }
        renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO'));
    </script>
</body>
