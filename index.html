<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Elite - Sourcing Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .hero-header { height: 260px; background: #000; position: relative; border-radius: 0 0 50px 50px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .hero-title { font-size: 38px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; }
        .cat-pill { flex: 0 0 auto; padding: 12px 22px; background: #fff; border-radius: 25px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1.5px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        .gem-card { background: #ffffff; border-radius: 32px; padding: 20px; border: 2.5px solid #f1f1f1; position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .img-wrap { height: 130px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 15px; border-radius: 20px; overflow: hidden; }
        .product-img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-header shadow-2xl">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800" class="hero-img">
        <div class="relative z-10">
            <span class="bg-blue-600 text-white text-[9px] font-black px-4 py-1.5 rounded-full uppercase mb-4 inline-block tracking-widest">Sourcing Elite Hub</span>
            <h1 class="hero-title">Worldshop<br><span style="color:var(--apple-blue)">Supreme.</span></h1>
        </div>
    </div>

    <div class="mt-10 px-6">
        <div class="flex gap-3 overflow-x-auto pb-6 no-scrollbar" id="catBar">
            <div class="cat-pill active" onclick="filterCat('all', this)">30 Pépites Mix</div>
            <div class="cat-pill" onclick="filterCat('Stockage', this)"><i class="fas fa-microchip text-red-500"></i> Hub SD/SSD</div>
            <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
            <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
            <div class="cat-pill" onclick="filterCat('Cuisine', this)">Cuisine</div>
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-5 mt-4" id="gemGrid"></div>

    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div onclick="closeModal()" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 border mb-8"><i class="fas fa-times"></i></div>
        <div class="text-center mb-12">
            <img id="modalImg" src="" class="w-56 h-56 mx-auto object-contain bg-white p-6 border rounded-[50px] shadow-2xl mb-8">
            <h2 id="modalName" class="text-2xl font-black italic leading-tight mb-2 uppercase">---</h2>
            <p id="modalAsin" class="text-3xl font-black text-blue-600 tracking-tighter mb-10">---</p>
            <div class="grid grid-cols-2 gap-4">
                <a id="amazonLink" target="_blank" class="bg-black text-white h-16 rounded-3xl flex items-center justify-center gap-3 font-black text-[11px] uppercase shadow-xl"><i class="fab fa-amazon text-orange-400"></i> Amazon</a>
                <a id="supplierLink" target="_blank" class="bg-slate-50 text-black h-16 rounded-3xl flex items-center justify-center gap-3 border shadow-inner font-black text-[11px] uppercase"><i class="fas fa-industry text-blue-600"></i> Usine OEM</a>
            </div>
        </div>
        <div class="bg-slate-50 rounded-[40px] p-8 mb-8 border">
            <div class="flex justify-between py-4 border-b border-slate-200"><span class="text-xs font-bold text-slate-500 uppercase">Prix Public</span><span id="modalPrice" class="font-black text-blue-600 text-lg">--€</span></div>
            <div class="flex justify-between py-4 border-b border-slate-200"><span class="text-xs font-bold text-slate-500 uppercase">Ventes Mensuelles</span><span id="modalSales" class="font-black text-emerald-600">---</span></div>
            <div class="flex justify-between py-4"><span class="text-xs font-bold text-slate-500 uppercase">ROI Est.</span><span id="modalROI" class="font-black text-green-600">50%+</span></div>
        </div>
        <div class="bg-black text-white rounded-[50px] p-10 mb-8 shadow-3xl">
            <div class="grid grid-cols-2 gap-6 mb-10">
                <div><p class="text-[9px] font-black text-slate-500 uppercase mb-3">Quantité</p><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-2xl p-4 text-center font-black"></div>
                <div><p class="text-[9px] font-black text-slate-500 uppercase mb-3">Achat €</p><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-2xl p-4 text-center font-black text-emerald-400"></div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[10px] font-black text-slate-500 mb-2 uppercase">C.A Total</p><p id="simCA" class="text-3xl font-black italic tracking-tighter">--€</p></div>
                <div class="text-right"><p class="text-[10px] font-black text-emerald-400 mb-2 uppercase">Profit Net</p><p id="simProfit" class="text-4xl font-black text-emerald-400 italic tracking-tighter">--€</p></div>
            </div>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-22 rounded-[35px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-2xl">Envoyer Demande Worldshop</button>
    </div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active text-white"><i class="fas fa-layer-group text-2xl"></i></div>
        <div onclick="switchView('fav')" class="nav-item text-gray-500"><i class="fas fa-heart text-2xl"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item text-blue-500"><i class="fas fa-crown text-2xl"></i></div>
        <div class="nav-item text-gray-500"><i class="fas fa-user-circle text-2xl"></i></div>
    </nav>

    <script>
        const allGems = [
            // GAMING (10 - DIVERSIFIÉS)
            {"asin":"B0D3GZYN1P","cat":"Gaming","name":"RK Royal Kludge R75","price":85.99,"sales":750,"imageUrl":"https://m.media-amazon.com/images/I/71u5e8OQ0-L.jpg","vendor":"rkgaming"},
            {"asin":"B0GHVWHRBQ","cat":"Gaming","name":"Ajazz AK820 Pro Keyboard","price":82.99,"sales":500,"imageUrl":"https://m.media-amazon.com/images/I/61M-FwS4fRL.jpg","vendor":"ajazz"},
            {"asin":"B07W5JKFQC","cat":"Gaming","name":"Logitech G203 LIGHTSYNC","price":26.68,"sales":1800,"imageUrl":"https://m.media-amazon.com/images/I/61oE1NouXuL.jpg","vendor":"togran"},
            {"asin":"B0GYD56QDW","cat":"Gaming","name":"Link Dream Headphone Stand","price":14.90,"sales":1200,"imageUrl":"https://m.media-amazon.com/images/I/61mpMH5TzkL.jpg","vendor":"linkdream"},
            {"asin":"B08DKS8W2Z","cat":"Gaming","name":"Quntis Monitor Light Bar","price":39.99,"sales":1100,"imageUrl":"https://m.media-amazon.com/images/I/71rA8v2FvKL.jpg","vendor":"highstar"},
            {"asin":"B0892D9F2G","cat":"Gaming","name":"Anker Soundcore Life Q30","price":79.99,"sales":1500,"imageUrl":"https://m.media-amazon.com/images/I/61CGHv6kmWL.jpg","vendor":"ebluetimes"},
            {"asin":"B09PQ1DCLK","cat":"Gaming","name":"Neewer 50-in-1 GoPro Kit","price":35.00,"sales":620,"imageUrl":"https://m.media-amazon.com/images/I/81Z8B+A5fPL.jpg","vendor":"puluz"},
            {"asin":"B00JX1ZS5O","cat":"Gaming","name":"Sabrent 4-Port Hub","price":18.50,"sales":1100,"imageUrl":"https://m.media-amazon.com/images/I/516+2Z7S2cL.jpg","vendor":"csjmax"},
            {"asin":"B07D373B25","cat":"Gaming","name":"Syncwire Cable Clips","price":9.99,"sales":2500,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"syncwire"},
            {"asin":"B07GS6ZB7T","cat":"Gaming","name":"Logitech G502 HERO Mouse","price":39.47,"sales":2100,"imageUrl":"https://m.media-amazon.com/images/I/61mpMH5TzkL.jpg","vendor":"togran"},
            // AUTO (10)
            {"asin":"B07QC6BVVW","cat":"Auto","name":"Autel AP200 Bluetooth","price":69.00,"sales":600,"imageUrl":"https://m.media-amazon.com/images/I/61b17LdIsHL.jpg","vendor":"autel"},
            {"asin":"B007XE8C74","cat":"Auto","name":"Autel AL319 OBD2 Red","price":35.99,"sales":1200,"imageUrl":"https://m.media-amazon.com/images/I/71zY6-bLURL.jpg","vendor":"autel"},
            {"asin":"B01G5K6GQA","cat":"Auto","name":"Ancel AD310 Scanner","price":35.99,"sales":1500,"imageUrl":"https://m.media-amazon.com/images/I/61TeqxNQwVL.jpg","vendor":"ancelobd"},
            {"asin":"B07QR4Q63Z","cat":"Auto","name":"AstroAI Air Compressor","price":45.99,"sales":1800,"imageUrl":"https://m.media-amazon.com/images/I/71aqvjpTNIL.jpg","vendor":"yyliuyang"},
            {"asin":"B00SP4PF04","cat":"Auto","name":"Digital Tire Pressure Gauge","price":12.99,"sales":2200,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"yyliuyang"},
            {"asin":"B085DMCH6S","cat":"Auto","name":"Lamicall Phone Mount","price":19.99,"sales":1500,"imageUrl":"https://m.media-amazon.com/images/I/71Kx8V6U9rL.jpg","vendor":"lamicall"},
            {"asin":"B07XJ1N4W2","cat":"Auto","name":"Favoto Motorcycle Cover","price":34.50,"sales":400,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","vendor":"hzguard"},
            {"asin":"B01N10S80B","cat":"Auto","name":"Expandable Cable Sleeve","price":16.50,"sales":2200,"imageUrl":"https://m.media-amazon.com/images/I/71qS6eH7GRL.jpg","vendor":"sztony"},
            {"asin":"B00O9S01A8","cat":"Auto","name":"Veepeak Mini OBD2","price":24.50,"sales":1400,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"huameide"},
            {"asin":"B07Y8S6S5S","cat":"Auto","name":"Backseat Car Organizer","price":22.90,"sales":900,"imageUrl":"https://m.media-amazon.com/images/I/71hj0Lp5C-L.jpg","vendor":"hzguard"},
            // CUISINE (10)
            {"asin":"B0113UZJE2","cat":"Cuisine","name":"Etekcity Digital Scale","price":18.99,"sales":2500,"imageUrl":"https://m.media-amazon.com/images/I/71S-9VUpURL.jpg","vendor":"vesync"},
            {"asin":"B0DFM1JHJS","cat":"Cuisine","name":"Tefal Optiss Scale","price":22.90,"sales":800,"imageUrl":"https://m.media-amazon.com/images/I/51r2zB4KURL.jpg","vendor":"tefal"},
            {"asin":"B00XN247V2","cat":"Cuisine","name":"ThermoPro Meat Thermometer","price":14.50,"sales":3500,"imageUrl":"https://m.media-amazon.com/images/I/71W7xwOF9oL.jpg","vendor":"thermopro"},
            {"asin":"B076F3C185","cat":"Cuisine","name":"Bonsenkitchen Frother","price":12.50,"sales":2200,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"hongmeihome"},
            {"asin":"B089K8L6N3","cat":"Cuisine","name":"Joseph Joseph Garlic Press","price":18.99,"sales":1500,"imageUrl":"https://m.media-amazon.com/images/I/61TeqxNQwVL.jpg","vendor":"angele"},
            {"asin":"B088K8ZMXQ","cat":"Cuisine","name":"Salad Spinner 4-in-1","price":34.00,"sales":890,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","vendor":"angele"},
            {"asin":"B01F58S948","cat":"Cuisine","name":"Digital Measuring Spoon","price":12.99,"sales":890,"imageUrl":"https://m.media-amazon.com/images/I/71p6nE+6L.jpg","vendor":"chinaquancheng"},
            {"asin":"B07PTNZT75","cat":"Cuisine","name":"Kitchen Scale Stainless","price":11.99,"sales":3000,"imageUrl":"https://m.media-amazon.com/images/I/71hj0Lp5C-L.jpg","vendor":"thermopro"},
            {"asin":"B01LXO8T93","cat":"Cuisine","name":"Milk Frother Elite","price":12.50,"sales":2200,"imageUrl":"https://m.media-amazon.com/images/I/61Ia4HvtVHL.jpg","vendor":"thermopro"},
            {"asin":"B0098S8W5E","cat":"Cuisine","name":"Magnetic Kitchen Timer","price":8.99,"sales":1200,"imageUrl":"https://m.media-amazon.com/images/I/61oE1NouXuL.jpg","vendor":"thermopro"},
            // HUB VIP (8)
            {"asin":"B0B7NTY2S6","cat":"Stockage","name":"SanDisk Ultra 128GB SD","price":24.99,"sales":2500,"imageUrl":"https://m.media-amazon.com/images/I/71Ow-Ih7KNL.jpg","vendor":"iotech"},
            {"asin":"B0DCW8FKK9","cat":"Stockage","name":"SanDisk Ultra Go Dual","price":26.99,"sales":1000,"imageUrl":"https://m.media-amazon.com/images/I/71UkwcNaIvL.jpg","vendor":"iotech"},
            {"asin":"B07NY23WBG","cat":"Stockage","name":"SanDisk Endurance SD","price":34.49,"sales":1200,"imageUrl":"https://m.media-amazon.com/images/I/619qRoAFthL.jpg","vendor":"iotech"},
            {"asin":"B0C8HHFX3C","cat":"Stockage","name":"Kingston NV2 1TB SSD","price":75.00,"sales":1800,"imageUrl":"https://m.media-amazon.com/images/I/516+2Z7S2cL.jpg","vendor":"iotech"},
            {"asin":"B09X7BQB4J","cat":"Stockage","name":"SanDisk Extreme 128GB","price":34.00,"sales":1100,"imageUrl":"https://m.media-amazon.com/images/I/51jolRaoHqL.jpg","vendor":"iotech"}
        ];
        let activeGem = null;
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                grid.innerHTML += `<div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                    <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.style.display='none'"></div>
                    <h3 class="text-[10px] font-black text-slate-400 truncate mb-1 uppercase">${gem.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-[18px] font-black text-blue-600">${gem.price}€</span><span class="text-[8px] bg-slate-50 px-2 py-1 rounded-md font-bold text-slate-400">${gem.sales} V/M</span></div>
                </div>`;
            });
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'Stockage'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin); if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin;
            document.getElementById('supplierLink').href = "https://" + activeGem.vendor + ".en.alibaba.com/productlist.html";
            updateSim(); document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function switchView(view) { if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'Stockage')); }
        function prepareDirectEmail() {
            const body = `Hello,\n\nThis is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${activeGem.asin}. Best regards, Mr. HOMY (+33642131515)`;
            window.location.href = `mailto:sales@factory.com?subject=OEM Inquiry - ASIN ${activeGem.asin}&body=${encodeURIComponent(body)}`;
        }
        renderGrid(allGems.filter(g => g.cat !== 'Stockage'));
    </script>
</body>
</html>
