<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Selection Hub - Worldshop Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        body { background-color: #ffffff; color: #111; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
        
        /* Apple Style Header */
        .apple-nav { position: fixed; top: 0; left: 0; right: 0; height: 110px; background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); padding-top: 50px; }
        .hero-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; text-align: center; margin-top: 130px; margin-bottom: 30px; color: #000; }
        
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 25px; padding: 0 25px; }
        .gem-card { background: #f5f5f7; border-radius: 35px; padding: 25px; border: 1px solid transparent; transition: all 0.3s; position: relative; }
        .gem-card:active { transform: scale(0.96); }
        .img-wrap { height: 220px; width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border-radius: 25px; overflow: hidden; background: #fff; }
        .product-img { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        .fav-icon { position: absolute; top: 25px; right: 25px; font-size: 20px; color: #ccc; z-index: 10; }
        .fav-active { color: #ff3b30 !important; }

        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        
        .sa-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; font-size: 14px; font-weight: 700; }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 25px; height: 75px; background: #000; border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 2000; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .nav-item { color: #555; font-size: 22px; cursor: pointer; }
        .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <nav class="apple-nav text-center">
        <h1 class="text-xs font-black tracking-[0.4em] uppercase opacity-40">Worldshop Sourcing Hub</h1>
    </nav>

    <h1 class="hero-title">Sourcing<br><span style="color:#0071e3">Intelligence.</span></h1>

    <div class="px-8 mb-12">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 opacity-30"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="Rechercher par ASIN ou Nom..." class="w-full bg-[#f5f5f7] border-none rounded-2xl pl-14 py-5 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
    </div>

    <div id="gemGrid" class="product-grid"></div>

    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div class="flex justify-between items-center mb-10">
            <div onclick="closeModal()" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center"><i class="fas fa-times"></i></div>
            <span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-4 py-1.5 rounded-lg uppercase tracking-widest">✓ Verified OEM Match</span>
        </div>

        <div class="text-center mb-12">
            <div class="h-72 flex items-center justify-center bg-white rounded-[40px] shadow-inner mb-8"><img id="modalImg" src="" class="max-h-[80%] max-w-[80%] object-contain"></div>
            <h2 id="modalName" class="text-2xl font-extrabold leading-tight mb-2 tracking-tight">---</h2>
            <p id="modalAsin" class="text-xl font-black text-blue-600 tracking-tighter mb-8">---</p>
        </div>

        <div class="bg-slate-50 p-6 rounded-[35px] mb-8 border border-slate-100">
            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest italic text-center">Analyse SellerAmp (Real-Time)</h3>
            <div class="sa-row"><span>Amazon Price</span><span id="modalPrice">--€</span></div>
            <div class="sa-row"><span>BSR Rank</span><span id="modalRank">---</span></div>
            <div class="sa-row"><span>Ventes / mois</span><span id="modalSales">---</span></div>
            <div class="sa-row border-none"><span>ROI Net</span><span id="modalROI" class="text-emerald-600">--%</span></div>
        </div>

        <!-- Simulator -->
        <div class="bg-black text-white p-10 rounded-[50px] mb-10 shadow-2xl">
            <div class="flex justify-between items-center mb-10">
                <p class="text-xs font-black uppercase tracking-widest text-slate-500">Calculateur Profit</p>
                <div class="flex gap-3">
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-1">QTÉ</span><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-20 bg-white/10 border-none rounded-xl p-3 text-center font-black"></div>
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-40 mb-1">ACHAT €</span><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-20 bg-white/10 border-none rounded-xl p-3 text-center font-black text-emerald-400"></div>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[9px] opacity-40 uppercase tracking-tighter">C.A RECAP</p><p id="simCA" class="text-3xl font-black italic">--€</p></div>
                <div class="text-right"><p class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest">PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-emerald-400 italic">--€</p></div>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <a id="amazonLink" target="_blank" class="flex-grow bg-black text-white h-20 rounded-3xl flex items-center justify-center gap-3 font-black text-xs uppercase shadow-xl"><i class="fab fa-amazon text-orange-400 text-xl"></i> Amazon.fr</a>
            <a id="supplierLink" target="_blank" class="w-20 h-20 bg-slate-100 rounded-3xl flex items-center justify-center shadow-inner"><i class="fas fa-industry text-2xl"></i></a>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-20 rounded-[30px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">Envoyer Demande Worldshop</button>
    </div>

    <nav class="nav-bar">
        <div onclick="location.reload()" id="navHome" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 450, behavior:'smooth'})" class="nav-item"><i class="fas fa-chart-line"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        let allGems = [];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_ultimate_favs') || '[]');

        document.addEventListener('DOMContentLoaded', loadGems);

        async function loadGems() {
            try {
                const res = await fetch('/daily-gems.json');
                allGems = await res.json();
                renderGrid(allGems);
            } catch(e) { console.error(e); }
        }

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach(gem => {
                const isFav = favorites.includes(gem.asin);
                grid.innerHTML += `
                    <div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                        <i class="${isFav ? 'fas text-red-500' : 'far'} fa-heart fav-icon" onclick="event.stopPropagation(); toggleFavorite('${gem.asin}', this)"></i>
                        <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'"></div>
                        <h3 class="text-sm font-bold truncate mb-1">${gem.name}</h3>
                        <p class="text-blue-600 font-black">${gem.price}€</p>
                        <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">ASIN: ${gem.asin}</p>
                    </div>`;
            });
        }

        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin);
            if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalRank').innerText = activeGem.rank;
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('modalROI').innerText = activeGem.roi;
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin.trim();
            document.getElementById('supplierLink').href = activeGem.supplierUrl;
            updateSim();
            document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }

        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        
        function filterGems() {
            const q = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(q) || g.asin.toLowerCase().includes(q)));
        }

        function toggleFavorite(asin, el) {
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_ultimate_favs', JSON.stringify(favorites));
            el.classList.toggle('fas'); el.classList.toggle('far'); el.classList.toggle('text-red-500');
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'home') { document.getElementById('navHome').classList.add('active'); renderGrid(allGems); }
            if(view === 'fav') { document.getElementById('navFav').classList.add('active'); renderGrid(allGems.filter(g => favorites.includes(g.asin))); }
        }

        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. We are looking for an OEM to supply ${activeGem.name} (Target ASIN: ${activeGem.asin}). It MUST be identical to this model: Amazon Link: ${amzLink} ... Best regards, Mr. HOMY`;
            window.location.href = `mailto:mark@feyongusb.com?subject=Inquiry Worldshop&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
