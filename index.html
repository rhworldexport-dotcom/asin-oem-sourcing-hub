<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Pro 9.5 - GlobalSeller Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --vip-red: #ff3b30; --status-locked: #8e8e93; --status-progress: #ff9500; --status-unlocked: #34c759; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        .hero-banner { height: 320px; background: #000; position: relative; border-radius: 0 0 60px 60px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.85; filter: brightness(0.7) contrast(1.2); }
        .hero-title { font-size: 40px; font-weight: 900; color: #fff; line-height: 0.9; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; text-transform: uppercase; }
        
        .data-card { background: #fff; border-radius: 40px; padding: 28px; border: 6px solid #f2f2f2; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.06); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 25px; }
        .card-ungating { border-color: #5856d6; } .card-vip { border-color: #ff3b30; }
        
        .status-badge { width: 100%; height: 45px; border-radius: 15px; font-size: 11px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; color: #fff; cursor: pointer; }
        .status-locked { background: var(--status-locked); }
        .status-progress { background: var(--status-progress); }
        .status-unlocked { background: var(--status-unlocked); }

        .asin-badge { font-size: 24px; font-weight: 900; color: #1d1d1f; letter-spacing: -1px; }
        .sales-badge { background: #f0fdf4; color: #166534; padding: 8px 16px; border-radius: 15px; font-size: 11px; font-weight: 900; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        .sa-panel { background: #f5f5f7; border-radius: 30px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        
        .action-btn { height: 60px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; font-weight: 900; text-transform: uppercase; transition: 0.2s; cursor: pointer; }
        .btn-mail { background: var(--apple-blue); color: #fff; width: 100%; margin-top: 15px; box-shadow: 0 12px 24px rgba(0, 113, 227, 0.3); }

        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 85px; background: rgba(0,0,0,0.96); backdrop-filter: blur(30px); border-radius: 45px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .nav-item { color: #555; font-size: 26px; cursor: pointer; } .nav-item.active { color: #fff; }
        .cat-pill { flex: 0 0 auto; padding: 12px 24px; background: #fff; border-radius: 25px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: 2px solid #eee; transition: 0.3s; }
        .cat-pill.active { background: #000; color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-44">
    <div class="hero-banner">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Night_View_of_Office_Buildings_in_Shenzhen_Bay.jpg" class="hero-img">
        <div class="relative z-10">
            <p class="text-blue-400 text-[9px] font-black uppercase tracking-[0.5em] mb-3 italic">GlobalSeller Certified</p>
            <h1 class="hero-title">Sourcing<br>Machine 9.5</h1>
        </div>
    </div>

    <div class="mt-8 px-6 flex gap-3 overflow-x-auto no-scrollbar" id="catBar">
        <div class="cat-pill active" onclick="filterCat('all', this)">Dashboard</div>
        <div class="cat-pill" style="background:#e5e7eb" onclick="filterCat('UNGATING', this)"><i class="fas fa-unlock-alt"></i> Hub Déblocage</div>
        <div class="cat-pill" style="background:#fee2e2" onclick="filterCat('VIP', this)"><i class="fas fa-crown"></i> Hub VIP</div>
        <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
        <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
    </div>

    <div class="px-6 space-y-1 mt-8" id="gemGrid"></div>

    <!-- Modal Master -->
    <div id="detailsModal" class="modal-view p-8 pb-32">
        <div class="flex justify-between items-center mb-10">
            <div onclick="closeModal()" class="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 border"><i class="fas fa-times text-xl"></i></div>
            <span id="modalTypeBadge" class="bg-blue-50 text-blue-600 text-[10px] font-black px-5 py-2.5 rounded-full uppercase border italic">✓ GlobalSeller Verified</span>
        </div>
        <div class="mb-10">
            <p id="modalAsinText" class="asin-badge mb-1">---</p>
            <h2 id="modalName" class="text-xl font-bold text-slate-500 uppercase truncate">---</h2>
        </div>
        <div class="sa-panel shadow-inner">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 italic">SellerAmp Analytics</h3>
            <div class="flex justify-between py-4 border-b border-slate-200"><span class="text-xs font-bold text-slate-500">Ventes / Mois</span><span id="modalSales" class="text-emerald-600 font-black">---</span></div>
            <div class="flex justify-between py-4 border-none"><span class="text-xs font-bold text-slate-500">Catégorie</span><span id="modalCat" class="uppercase font-black text-blue-600">---</span></div>
        </div>
        <div class="bg-black text-white rounded-[45px] p-8 mb-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-600 opacity-20 blur-3xl"></div>
            <div class="grid grid-cols-1 gap-4 mb-4 relative z-10">
                <a id="amzLink" target="_blank" class="action-btn bg-white/10 border border-white/20"><i class="fab fa-amazon text-orange-400"></i> Fiche Amazon.fr</a>
                <a id="oemLink" target="_blank" class="action-btn bg-white/10 border border-white/20"><i class="fas fa-industry text-blue-400"></i> Usine OEM Alibaba</a>
                <a id="ungatingLink" target="_blank" class="action-btn bg-blue-600/30 border border-blue-500/40" style="display:none"><i class="fas fa-euro-sign text-green-400"></i> Grossiste Déblocage EU</a>
            </div>
        </div>
        <button onclick="sendStrategicMail()" class="action-btn btn-mail">Envoyer Email Julie</button>
    </div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-layer-group"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item text-blue-400"><i class="fas fa-bolt"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            // HUB UNGATING (Les 10 Pépites GlobalSeller)
            {"asin":"B096KHQWMF","cat":"UNGATING","name":"Brosse Auto-Nettoyante","sales":"+1000","vendor":"https://www.alibaba.com/product-detail/Durable-Pet-Slicker-Brush-Self-Cleaning_1601577080646.html","ungating":"https://www.ankorstore.com/brand/trixie-14631","amz":"https://www.amazon.fr/dp/B096KHQWMF"},
            {"asin":"B0BK4MM3SS","cat":"UNGATING","name":"Support PC Pliable","sales":"+600","vendor":"https://www.alibaba.com/product-detail/Ergonomic-Portable-Aluminium-Alloy-Foldable-Laptop_1600610840076.html","ungating":"https://www.bruneau.fr/marques/fellowes","amz":"https://www.amazon.fr/dp/B0BK4MM3SS"},
            {"asin":"B0FDWVQY93","cat":"UNGATING","name":"Organisateur Coffre","sales":"+50","vendor":"https://www.alibaba.com/product-detail/600D-Oxford-Foldable-Waterproof-Collapsible-Multi_1601368213972.html","ungating":"https://www.tradaka.com/fr/accessoires-auto","amz":"https://www.amazon.fr/dp/B0FDWVQY93"},
            {"asin":"B0GQ2WRS9X","cat":"UNGATING","name":"Harnais Tactique","sales":"+60","vendor":"https://www.alibaba.com/product-detail/Factory-Custom-Adjustable-Reflective-Tactical-No_1601586462538.html","ungating":"https://www.faire.com/brand/br_trixie","amz":"https://www.amazon.fr/dp/B0GQ2WRS9X"},
            {"asin":"B0CRVM31SC","cat":"UNGATING","name":"Pulvérisateur Huile","sales":"+150","vendor":"https://www.alibaba.com/product-detail/OEM-100ml-Stainless-Steel-Lid-Glass_1601601469225.html","ungating":"https://www.vente-du-pro.com/cuisine","amz":"https://www.amazon.fr/dp/B0CRVM31SC"},
            {"asin":"B07LB3YMLS","cat":"UNGATING","name":"Moulin Café Manuel","sales":"+150","vendor":"https://www.alibaba.com/product-detail/Hot-Custom-Logo-Adjustable-Conical-Burr_1600867501832.html","ungating":"https://www.maxicoffee.com/hario-m-108.html","amz":"https://www.amazon.fr/dp/B07LB3YMLS"},
            {"asin":"B0878BW95W","cat":"UNGATING","name":"Bandes Fitness (11pcs)","sales":"+300","vendor":"https://www.alibaba.com/product-detail/MKAS-New-Arrival-Resistance-Bands-Set_1601354036174.html","ungating":"https://www.sport-thieme.fr/Fitness","amz":"https://www.amazon.fr/dp/B0878BW95W"},
            {"asin":"B09TNRRK2Q","cat":"UNGATING","name":"Nettoyeur Pattes Chien","sales":"+80","vendor":"https://www.alibaba.com/product-detail/2-in-1-Silicone-Dog-Paw_1600687244336.html","ungating":"https://www.polytrans.fr/marques/trixie/","amz":"https://www.amazon.fr/dp/B09TNRRK2Q"},
            {"asin":"B0D5D13ZJ2","cat":"UNGATING","name":"Sacs Silicone (Lot 10)","sales":"+100","vendor":"https://www.alibaba.com/product-detail/Reusable-Storage-Bags-10-Pack-PEVA_1600117967954.html","ungating":"https://www.orderchamp.com/fr/brand/lekue","amz":"https://www.amazon.fr/dp/B0D5D13ZJ2"},
            {"asin":"B09QX5S925","cat":"UNGATING","name":"Sous-main Cuir 90x40","sales":"+400","vendor":"https://www.alibaba.com/product-detail/90-40cm-Waterproof-Premium-Desk-Mat_1601456430982.html","ungating":"https://www.vikingdirect.fr/fr/logitech-m-802","amz":"https://www.amazon.fr/dp/B09QX5S925"},
            // HUB VIP
            {"asin":"B0B9C3ZVHR","cat":"VIP","name":"Samsung 990 PRO 1TB SSD","sales":"+3500","vendor":"https://samsung-oem.en.alibaba.com","amz":"https://amazon.fr/dp/B0B9C3ZVHR"},
            {"asin":"B0B7NTY2S6","cat":"VIP","name":"SanDisk Ultra 128GB SD","sales":"+2500","vendor":"https://kissin.en.alibaba.com","amz":"https://amazon.fr/dp/B0B7NTY2S6"}
        ];

        let favorites = JSON.parse(localStorage.getItem('ws_favs_vFinal') || '[]');
        let statusDB = JSON.parse(localStorage.getItem('ws_ungating_stats') || '{}');

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const isFav = favorites.includes(gem.asin);
                const currentStatus = statusDB[gem.asin] || 'Bloqué';
                const statusClass = currentStatus === 'Bloqué' ? 'status-locked' : (currentStatus === 'En cours' ? 'status-progress' : 'status-unlocked');
                grid.innerHTML += `
                    <div class="data-card card-${gem.cat.toLowerCase()}" onclick="openDetails('${gem.asin}')">
                        <i class="fas fa-heart fav-btn ${isFav?'fav-active':''}" onclick="toggleFav('${gem.asin}', this, event)"></i>
                        <div class="flex justify-between items-start mb-4">
                            <div><p class="asin-badge">${gem.asin}</p><p class="text-[12px] font-black text-slate-400 uppercase truncate w-48">${gem.name}</p></div>
                            <span class="sales-badge">${gem.sales} V/M</span>
                        </div>
                        ${gem.cat === 'UNGATING' ? `<div class="status-badge ${statusClass}" onclick="cycleStatus('${gem.asin}', this, event)">${currentStatus}</div>` : ''}
                    </div>`;
            });
        }

        function cycleStatus(asin, el, e) {
            e.stopPropagation();
            const states = ['Bloqué', 'En cours', 'Débloqué'];
            let next = states[(states.indexOf(statusDB[asin] || 'Bloqué') + 1) % 3];
            statusDB[asin] = next; localStorage.setItem('ws_ungating_stats', JSON.stringify(statusDB));
            el.className = `status-badge ${next === 'Bloqué' ? 'status-locked' : (next === 'En cours' ? 'status-progress' : 'status-unlocked')}`;
            el.innerText = next;
        }

        function openDetails(asin) {
            const gem = allGems.find(g => g.asin === asin); if(!gem) return;
            document.getElementById('modalAsinText').innerText = gem.asin;
            document.getElementById('modalName').innerText = gem.name;
            document.getElementById('modalSales').innerText = gem.sales + ' ventes / mois';
            document.getElementById('modalCat').innerText = gem.cat;
            document.getElementById('amzLink').href = gem.amz;
            document.getElementById('oemLink').href = gem.vendor;
            const ungBtn = document.getElementById('ungatingLink');
            if(gem.cat === 'UNGATING') { ungBtn.style.display = 'flex'; ungBtn.href = gem.ungating; } else { ungBtn.style.display = 'none'; }
            document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function toggleFav(asin, el, e) {
            e.stopPropagation();
            if(favorites.includes(asin)) { favorites = favorites.filter(a => a !== asin); el.classList.remove('fav-active'); }
            else { favorites.push(asin); el.classList.add('fav-active'); }
            localStorage.setItem('ws_favs_vFinal', JSON.stringify(favorites));
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'UNGATING'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }

        function sendStrategicMail() {
            const asin = document.getElementById('modalAsinText').innerText;
            const gem = allGems.find(g => g.asin === asin);
            const body = `Dear Julie,\n\nWe are looking for BOTH options for ${gem.name} (ASIN: ${gem.asin}):\n1. OEM quality / original chipsets.\n2. 100% Original cards.\n\nAmazon Link: ${gem.amz}\n\nOur target is 30% margin. Best regards,\nWorldshop Team\nWhatsApp: +33664231515`;
            window.location.href = `mailto:julie@factory.com?subject=Inquiry ${gem.asin}&body=${encodeURIComponent(body)}`;
        }

        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function switchView(view) {
            if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'UNGATING'));
            if(view === 'fav') renderGrid(allGems.filter(g => favorites.includes(g.asin)));
        }
        renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'UNGATING'));
    </script>
</body>
</html>
