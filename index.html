<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sourcing Hub - Worldshop Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        body { background-color: #ffffff; color: #111; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
        
        /* Hero Header Immersif Apple Style */
        .hero-banner { 
            background: #000; 
            height: 380px; 
            position: relative; 
            display: flex; 
            align-items: flex-end; 
            padding: 40px 30px; 
            border-radius: 0 0 50px 50px;
            overflow: hidden;
        }
        .hero-banner img { position: absolute; inset: 0; width:100%; height:100%; object-fit: cover; opacity: 0.4; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: 42px; line-height: 1; color: white; position: relative; z-index: 10; }
        
        /* Grid Layout Corrigé */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .gem-card { background: #fff; border-radius: 28px; overflow: hidden; border: 1px solid #f1f1f1; box-shadow: 0 8px 25px rgba(0,0,0,0.03); cursor: pointer; transition: transform 0.2s; }
        .gem-card:active { transform: scale(0.95); }
        .img-container { height: 180px; background: #f9f9f9; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Modal Sheet */
        .modal-sheet { background: white; border-radius: 45px 45px 0 0; position: fixed; inset: 0; z-index: 9999; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 25px; height: 75px; background: #000; border-radius: 40px; display: flex; justify-content: space-around; align-items: center; z-index: 5000; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .nav-item { color: #555; font-size: 22px; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .sa-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; font-weight: 700; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">
    <!-- Hero Header Apple Style -->
    <div class="hero-banner shadow-2xl">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1200&q=80">
        <div class="hero-content">
            <span class="bg-emerald-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Worldshop Selection</span>
            <h1 class="hero-title italic mt-3">Sourcing<br>Intelligence.</h1>
        </div>
    </div>

    <!-- Search Section -->
    <div class="px-8 mt-10">
        <div class="relative mb-10">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="ASIN ou Mot-clé..." class="w-full bg-slate-50 border-none rounded-2xl pl-12 pr-4 py-5 text-sm focus:ring-2 focus:ring-black shadow-inner">
        </div>
        
        <h2 class="text-xl font-black mb-8 italic tracking-tighter flex justify-between items-center">
            Notre Collection <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">30 Pépites</span>
        </h2>
        
        <!-- Grid layout -->
        <div id="gemGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <!-- Modal Dossier Expert (SellerAmp Style) -->
    <div id="dossierModal" class="modal-sheet p-10 pb-20">
        <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-10" onclick="closeModal()"></div>
        <div class="flex flex-col gap-6 mb-10 text-center">
            <div class="h-64 flex items-center justify-center bg-slate-50 rounded-[45px] p-8 mb-8 shadow-inner">
                <img id="modalImg" src="" class="max-h-full max-w-full object-contain">
            </div>
            <div>
                <span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-4 py-1.5 rounded-full mb-4 inline-block uppercase">✓ Verified Sourcing</span>
                <h2 id="modalName" class="text-2xl font-bold leading-tight mb-2 uppercase italic tracking-tight text-slate-800">---</h2>
                <p id="modalAsin" class="text-xl font-black text-emerald-500 mb-8 border-b pb-6">---</p>
                <div class="grid grid-cols-2 gap-4">
                    <a id="amazonLink" target="_blank" class="bg-black text-white p-5 rounded-3xl font-black text-xs uppercase flex items-center justify-center gap-2 shadow-xl"><i class="fab fa-amazon text-orange-400"></i> Amazon</a>
                    <a id="supplierLink" target="_blank" class="bg-slate-100 text-black p-5 rounded-3xl font-black text-xs uppercase flex items-center justify-center gap-2"><i class="fas fa-industry"></i> Usine OEM</a>
                </div>
            </div>
        </div>

        <!-- SellerAmp Stats -->
        <div class="bg-slate-50 p-8 rounded-[40px] mb-10 border border-slate-100">
            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest italic">Analyse de Marché (SellerAmp)</h3>
            <div class="sa-row"><span>Amazon Price</span><span id="modalPrice">--€</span></div>
            <div class="sa-row"><span>Rank BSR</span><span id="modalRank">---</span></div>
            <div class="sa-row"><span>Ventes / mois</span><span id="modalSales">---</span></div>
            <div class="sa-row border-none"><span>ROI Garanti</span><span id="modalROI" class="text-emerald-600">--%</span></div>
        </div>

        <!-- Profit Calculator -->
        <div class="bg-slate-50 p-8 rounded-[40px] mb-10 border border-slate-100">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="flex flex-col"><span class="text-[9px] font-bold text-slate-400 uppercase mb-1">Quantité</span><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-full bg-white border-none rounded-xl p-3 text-center font-black"></div>
                <div class="flex flex-col"><span class="text-[9px] font-bold text-slate-400 uppercase mb-1">Achat €</span><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-full bg-white border-none rounded-xl p-3 text-center font-black text-emerald-600"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-[25px] text-center shadow-sm"><p class="text-[9px] text-slate-400 mb-1 font-bold">C.A</p><p id="simCA" class="text-xl font-black">--€</p></div>
                <div class="bg-emerald-600 p-5 rounded-[25px] text-center text-white shadow-lg"><p class="text-[9px] opacity-80 mb-1 font-bold">PROFIT</p><p id="simProfit" class="text-xl font-black">--€</p></div>
            </div>
        </div>

        <!-- Target (BUG FIX: This element was missing in previous build causing crash on click!) -->
        <div class="bg-slate-100 p-10 rounded-[35px] text-center mb-12 border-2 border-dashed border-slate-200">
            <p class="text-[10px] text-slate-500 font-black mb-2 uppercase tracking-widest">Cible Achat FOB Max</p>
            <p id="modalMaxCost" class="text-6xl font-black italic">--€</p>
        </div>

        <button onclick="prepareDirectEmail()" class="w-full h-20 rounded-[30px] bg-black text-white font-black text-xs uppercase shadow-2xl">Envoyer Demande Worldshop</button>
    </div>

    <!-- Nav Bar -->
    <nav class="nav-bar">
        <div onclick="location.reload()" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 400, behavior:'smooth'})" class="nav-item"><i class="fas fa-search-plus"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            {"name":"Hub USB-C Luxe 7-in-1","asin":"B08Q7KDQKP","price":"34.99","sales":1250,"roi":65,"profit":"12.40","maxCost":"10.50","rank":"#245","imageUrl":"https://m.media-amazon.com/images/I/71u9S+Y6m6L._AC_SL1500_.jpg"},
            {"name":"SSD 1TB Pro Gen4","asin":"B0C8HHFX3C","price":"75.00","sales":1400,"roi":60,"profit":"22.00","maxCost":"18.50","rank":"#215","imageUrl":"https://m.media-amazon.com/images/I/71X8kC-iGLL._AC_SL1500_.jpg"},
            {"name":"Câble RJ45 Cat8 Gold","asin":"B08LNWDP6V","price":"14.90","sales":3200,"roi":95,"profit":"5.50","maxCost":"3.20","rank":"#12","imageUrl":"https://m.media-amazon.com/images/I/71Uo7P7pMGL._AC_SL1500_.jpg"},

            {"name":"Mousseur Lait Elite","asin":"B06K6K6K6K","price":"19.99","sales":2500,"roi":90,"profit":"7.50","maxCost":"4.20","rank":"#12","imageUrl":"https://m.media-amazon.com/images/I/61D8YyS8MML._AC_SL1500_.jpg"},
            {"name":"Balances Cuisine Inox","asin":"B0D3D3D3D3","price":"22.50","sales":1800,"roi":62,"profit":"8.10","maxCost":"6.00","rank":"#340","imageUrl":"https://m.media-amazon.com/images/I/61iNn3Z-9yL._AC_SL1500_.jpg"},
            {"name":"Thermomètre Viande Connect","asin":"B0I8I8I8I8","price":"28.00","sales":1500,"roi":75,"profit":"10.50","maxCost":"7.00","rank":"#150","imageUrl":"https://m.media-amazon.com/images/I/71R2o5nK5SL._AC_SL1500_.jpg"},
            {"name":"Presse Ail Ergo","asin":"B0N3N3N3N3","price":"12.00","sales":4000,"roi":110,"profit":"5.20","maxCost":"2.50","rank":"#3","imageUrl":"https://m.media-amazon.com/images/I/615485290382-441e4d049cb5?w=400"},
            {"name":"Aspirateur Auto Pro 12V","asin":"B0M2M2M2M2","price":"45.00","sales":1400,"roi":63,"profit":"14.20","maxCost":"11.50","rank":"#280","imageUrl":"https://images.unsplash.com/photo-1563911302283-d2bc129e7570?w=400"},
            {"name":"Casque Audio Pro ANC","asin":"B0892D9F2G","price":"129.00","sales":850,"roi":72,"profit":"45.10","maxCost":"35.00","rank":"#89","imageUrl":"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"},
            {"name":"Webcam 4K Stream","asin":"B0B1B1B1B1","price":"75.00","sales":540,"roi":64,"profit":"22.10","maxCost":"18.00","rank":"#560","imageUrl":"https://images.unsplash.com/photo-1588508065123-287b28e013da?w=400"},
            {"name":"Kit GoPro Pro Adventure","asin":"B09PQ1DCLK","price":"35.00","sales":620,"roi":70,"profit":"12.00","maxCost":"9.50","rank":"#302","imageUrl":"https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=400"},
            {"name":"Support Tablette Ergo","asin":"B0CBMNFK84","price":"22.00","sales":560,"roi":68,"profit":"8.20","maxCost":"7.00","rank":"#112","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Sac de Transport SSD","asin":"B0S7S7S7S7","price":"16.50","sales":2200,"roi":88,"profit":"6.80","maxCost":"4.50","rank":"#34","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Organiseur Coffre Luxe","asin":"B0H7H7H7H7","price":"38.00","sales":920,"roi":59,"profit":"11.50","maxCost":"9.00","rank":"#670","imageUrl":"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=400"},
            {"name":"Protège Réservoir Moto","asin":"B0T8T8T8T8","price":"21.00","sales":560,"roi":76,"profit":"8.50","maxCost":"6.00","rank":"#1100","imageUrl":"https://images.unsplash.com/photo-1558981359-219d6364c9c8?w=400"},
            {"name":"Câble HDMI 2.1 Tressé","asin":"B0L1L1L1L1","price":"14.99","sales":3500,"roi":95,"profit":"5.50","maxCost":"3.00","rank":"#5","imageUrl":"https://images.unsplash.com/photo-1515940175183-6798529cb860?w=400"},
            {"name":"Moulin Poivre Elec","asin":"B0R6R6R6R6","price":"34.00","sales":890,"roi":67,"profit":"11.20","maxCost":"9.00","rank":"#450","imageUrl":"https://images.unsplash.com/photo-1589083548981-9b6574f9d0c6?w=400"},
            {"name":"Kit Vis SSD M.2 Pro","asin":"B0BW2NMM8D","price":"9.99","sales":2500,"roi":110,"profit":"4.50","maxCost":"2.20","rank":"#542","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Tapis Souris XXL RGB","asin":"B0P4P4P4P4","price":"29.90","sales":1200,"roi":74,"profit":"10.50","maxCost":"8.00","rank":"#540","imageUrl":"https://images.unsplash.com/photo-1618366712277-721206c8340d?w=400"},
            {"name":"Compresseur Pneu Port","asin":"B0C2C2C2C2","price":"49.00","sales":1300,"roi":78,"profit":"18.40","maxCost":"14.50","rank":"#210","imageUrl":"https://images.unsplash.com/photo-1597404294360-fedeca0445fc?w=400"},
            {"name":"Projecteur LED Auto 12V","asin":"B09X9X9X9X","price":"39.99","sales":1100,"roi":85,"profit":"15.00","maxCost":"12.00","rank":"#234","imageUrl":"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400"},
            {"name":"Station Accueil Pro","asin":"B0DLB8ZQG5","price":"49.90","sales":320,"roi":55,"profit":"12.50","maxCost":"11.00","rank":"#890","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Adaptateur MicroSD USB-C","asin":"B0V8V8V8V8","price":"15.50","sales":560,"roi":50,"profit":"4.90","maxCost":"4.50","rank":"#34","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Lumière RGB Gaming Set","asin":"B0K0K0K0K0","price":"35.00","sales":1100,"roi":78,"profit":"12.50","maxCost":"9.50","rank":"#310","imageUrl":"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"},
            {"name":"Hub USB-C Multiports","asin":"B0G6G6G6G6","price":"42.00","sales":2100,"roi":68,"profit":"15.40","maxCost":"12.00","rank":"#24","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Sacoche Rigide SSD","asin":"B0S7S7S7S7","price":"16.50","sales":2200,"roi":88,"profit":"6.80","maxCost":"4.50","rank":"#34","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=400"},
            {"name":"Support Smartphone Auto","asin":"B09X9X9X9X","price":"19.99","sales":890,"roi":62,"profit":"7.10","maxCost":"6.20","rank":"#312","imageUrl":"https://images.unsplash.com/photo-1586105251261-72a756497a11?w=400"},
            {"name":"Gadget Cuisine 5-en-1","asin":"B06K6K6K6K","price":"29.90","sales":180,"roi":64,"profit":"10.20","maxCost":"8.90","rank":"#450","imageUrl":"https://images.unsplash.com/photo-1593611664164-5d4474834247?w=400"}
        ];

        let activeGem = null;
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach(gem => {
                grid.innerHTML += `<div class="gem-card" onclick="openDetails('${gem.asin}')">
                    <div class="img-container"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'"></div>
                    <div class="p-6">
                        <h3 class="text-[10px] font-black truncate uppercase mb-2 text-slate-800">${gem.name}</h3>
                        <div class="flex justify-between items-center"><span class="text-emerald-600 font-black text-xl italic">${gem.price}€</span><span class="text-[9px] text-slate-400 font-bold">${gem.sales} V/M</span></div>
                    </div></div>`;
            });
        }
        function openDetails(asin) {
            const gem = allGems.find(g => g.asin === asin);
            if(!gem) return;
            activeGem = gem;
            document.getElementById('modalImg').src = gem.imageUrl;
            document.getElementById('modalName').innerText = gem.name;
            document.getElementById('modalAsin').innerText = gem.asin;
            document.getElementById('modalPrice').innerText = gem.price + "€";
            document.getElementById('modalRank').innerText = gem.rank;
            document.getElementById('modalSales').innerText = gem.sales + " / mois";
            document.getElementById('modalROI').innerText = gem.roi + "%";
            document.getElementById('modalMaxCost').innerText = gem.maxCost + "€";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + gem.asin.trim();
            document.getElementById('supplierLink').href = "https://www.alibaba.com/showroom/oem-manufacturer-" + gem.asin + ".html";
            updateSim();
            document.getElementById('dossierModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('dossierModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function filterGems() {
            const q = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(q) || g.asin.toLowerCase().includes(q)));
        }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. It MUST be identical to this model: Amazon Link: ${amzLink} ... Best regards, Mr. HOMY`;
            window.location.href = `mailto:mark@feyongusb.com?subject=Inquiry Worldshop Sourcing&body=${encodeURIComponent(body)}`;
        }
        document.addEventListener('DOMContentLoaded', () => renderGrid(allGems));
    </script>
</body>
</html>
