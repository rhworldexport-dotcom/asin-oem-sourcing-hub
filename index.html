<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Selection Hub - Obsidian Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        
        :root {
            --bg: #08080a;
            --card: #121214;
            --rose: #E2B4BD;
            --emerald: #10b981;
            --text: #ffffff;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glass-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 140px;
            background: rgba(8, 8, 10, 0.7);
            backdrop-filter: saturate(180%) blur(35px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .luxe-card {
            background: var(--card);
            border-radius: 35px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .luxe-card:active { transform: scale(0.95); opacity: 0.8; }

        .nav-bar {
            position: fixed;
            bottom: 30px; left: 24px; right: 24px;
            height: 75px;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(40px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 2000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .nav-item { color: #52525b; font-size: 20px; cursor: pointer; }
        .nav-item.active { color: var(--rose); transform: scale(1.1); }

        .modal-sheet {
            background: linear-gradient(to bottom, #111114, #08080a);
            border-radius: 60px 60px 0 0;
            position: fixed; inset: 0; z-index: 9999;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 50px;
        }
        .modal-active { transform: translateY(0); }

        .search-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            padding: 15px 25px;
        }

        @keyframes reveal { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .animate-reveal { animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pt-[160px] pb-40 px-6">

    <!-- Header Luminous -->
    <div class="glass-header">
        <div class="flex justify-between items-center w-full mb-4">
            <div>
                <p class="text-[10px] font-black tracking-[0.5em] uppercase opacity-40 mb-1">Maison Accio</p>
                <h1 class="text-3xl font-extrabold tracking-tighter italic text-white">Selection <span style="color:var(--rose)">Hub</span></h1>
            </div>
            <div class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center bg-white/5">
                <i class="fas fa-gem text-sm" style="color:var(--rose)"></i>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <div class="mb-10 animate-reveal">
        <div class="search-container flex items-center shadow-2xl">
            <i class="fas fa-search text-slate-600 mr-4 text-sm"></i>
            <input type="text" id="keywordSearch" oninput="filterGems()" placeholder="Rechercher par ASIN ou Mot-clé..." class="bg-transparent w-full focus:outline-none text-sm font-medium text-white placeholder-slate-600">
        </div>
    </div>

    <!-- Grid Layout -->
    <div id="gemGrid" class="grid grid-cols-2 gap-6 animate-reveal" style="animation-delay: 0.1s"></div>

    <!-- Dossier Modal (The Fix is here!) -->
    <div id="dossierModal" class="modal-sheet p-8">
        <div class="w-14 h-1.5 bg-white/10 rounded-full mx-auto mb-10" onclick="closeModal()"></div>
        
        <div class="flex flex-col gap-8 mb-12 text-center">
            <div class="h-80 flex items-center justify-center bg-white/[0.02] rounded-[45px] p-8 border border-white/5 shadow-inner">
                <img id="modalImg" src="" class="max-h-full max-w-full object-contain drop-shadow-2xl">
            </div>
            <div>
                <span class="bg-emerald-500 text-white text-[9px] font-black tracking-widest px-3 py-1 rounded-full mb-4 inline-block uppercase">✓ Verified Sourcing (Safe)</span>
                <h2 id="modalName" class="text-2xl font-black leading-tight mb-2 italic tracking-tighter text-white">---</h2>
                <p id="modalAsin" class="text-3xl font-black text-emerald-400 tracking-tighter border-b border-white/5 pb-4 mb-8">---</p>
                
                <div class="grid grid-cols-2 gap-4">
                    <a id="amazonLink" target="_blank" class="bg-white text-black py-5 rounded-[25px] flex items-center justify-center gap-3 font-black text-xs uppercase shadow-xl active:scale-95 transition-all">
                        <i class="fab fa-amazon text-orange-500 text-xl"></i> Amazon.fr
                    </a>
                    <a id="supplierLink" target="_blank" class="bg-white/5 text-white py-5 rounded-[25px] flex items-center justify-center gap-3 border border-white/10 active:scale-95 transition-all">
                        <i class="fas fa-industry text-xl"></i> Manufacture
                    </a>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-10">
            <div class="bg-white/[0.01] p-6 rounded-[35px] text-center border border-white/5">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1">BSR Rank</p>
                <p id="modalRank" class="text-sm font-black text-white">---</p>
            </div>
            <div class="bg-white/[0.01] p-6 rounded-[35px] text-center border border-white/5">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Ventes Est.</p>
                <p id="modalSales" class="text-sm font-black text-white">---</p>
            </div>
            <div class="bg-emerald-500/10 p-6 rounded-[35px] text-center border border-emerald-500/20">
                <p class="text-[9px] text-emerald-400 font-black uppercase mb-1">ROI Exp.</p>
                <p id="modalROI" class="text-sm font-black text-emerald-400">--%</p>
            </div>
        </div>

        <div class="bg-white/5 p-8 rounded-[50px] mb-10 border border-white/5 shadow-2xl">
            <div class="flex justify-between items-center mb-10 text-xs font-black uppercase tracking-widest text-slate-500">Calculateur Profit Elite
                <div class="flex gap-4">
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-30 mb-2 uppercase">QTÉ</span><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-18 bg-white/10 border-none rounded-xl p-3 text-center font-black text-lg text-white"></div>
                     <div class="flex flex-col items-center"><span class="text-[8px] opacity-30 mb-2 uppercase">ACHAT €</span><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-20 bg-white/10 border-none rounded-xl p-3 text-center font-black text-lg text-emerald-400"></div>
                </div>
            </div>
            <div class="flex justify-between items-end mb-10">
                <div><p class="text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-tighter">C.A RECAP</p><p id="simCA" class="text-3xl font-black italic tracking-tighter text-white">--€</p></div>
                <div class="text-right"><p class="text-[10px] font-bold text-emerald-400 mb-2 uppercase tracking-widest">PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-emerald-400 italic tracking-tighter">--€</p></div>
            </div>
        </div>

        <!-- Missing Element Added Back -->
        <div id="modalMaxCost" style="display:none"></div>
        <button onclick="prepareDirectEmail()" class="w-full h-20 rounded-[30px] bg-emerald-600 text-white font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">Envoyer Demande Worldshop</button>
        <button onclick="closeModal()" class="w-full text-slate-700 text-[10px] font-black uppercase tracking-[0.6em] mt-10 text-center">Fermer</button>
    </div>

    <!-- Tab Bar -->
    <nav class="nav-bar">
        <div onclick="location.reload()" id="navHome" class="nav-item active"><i class="fas fa-house-chimney"></i></div>
        <div class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item"><i class="fas fa-search-plus"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            {"name":"Hub USB-C Luxe 7-in-1","asin":"B08Q7KDQKP","price":"34.99","sales":1250,"roi":65,"rank":"#245","maxCost":"10.50","imageUrl":"https://images.unsplash.com/photo-1544244015-0cd4b3ff8f9d?w=600"},
            {"name":"SSD 1TB Pro Gen4","asin":"B0C8HHFX3C","price":"75.00","sales":1400,"roi":60,"rank":"#215","maxCost":"18.50","imageUrl":"https://images.unsplash.com/photo-1591405351990-4726e33df58d?w=600"},
            {"name":"Câble Cat8 Gold Pro","asin":"B08LNWDP6V","price":"14.90","sales":3200,"roi":95,"rank":"#12","maxCost":"3.20","imageUrl":"https://images.unsplash.com/photo-1515940175183-6798529cb860?w=600"},
            {"name":"Souris MSI Gaming Pro","asin":"B096Y43J5T","price":"49.00","sales":560,"roi":58,"rank":"#407","maxCost":"12.50","imageUrl":"https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=600"},
            {"name":"Support Mural Mesh TP","asin":"B0CN3CV93T","price":"18.50","sales":890,"roi":72,"rank":"#107","maxCost":"5.50","imageUrl":"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600"},
            {"name":"Mousseur Lait Elite","asin":"B06K6K6K6K","price":"19.99","sales":2500,"roi":90,"rank":"#12","maxCost":"4.20","imageUrl":"https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=600"},
            {"name":"Balances Cuisine Inox","asin":"B0D3D3D3D3","price":"22.50","sales":1800,"roi":62,"rank":"#340","maxCost":"6.00","imageUrl":"https://images.unsplash.com/photo-1590372875891-3e13d94ca060?w=600"},
            {"name":"Thermomètre Viande","asin":"B0I8I8I8I8","price":"28.00","sales":1500,"roi":75,"rank":"#150","maxCost":"7.00","imageUrl":"https://images.unsplash.com/photo-1585830812416-a6c86bb14576?w=600"},
            {"name":"Presse Ail Ergo","asin":"B0N3N3N3N3","price":"12.00","sales":4000,"roi":110,"maxCost":"2.50","imageUrl":"https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=600"},
            {"name":"Adaptateur HDMI Pro","asin":"B0B9L41TLK","price":"22.50","sales":1300,"roi":64,"rank":"#891","maxCost":"6.50","imageUrl":"https://images.unsplash.com/photo-1515940175183-6798529cb860?w=600"}
        ];

        let activeGem = null;
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid');
            grid.innerHTML = '';
            data.forEach(gem => {
                grid.innerHTML += `<div class="luxe-card p-4 animate-reveal" onclick="openDetails('${gem.asin}')">
                    <div class="h-44 bg-slate-900 rounded-[35px] relative overflow-hidden mb-4 border border-white/5 shadow-2xl">
                        <img src="${gem.imageUrl}" class="w-full h-full object-cover opacity-90">
                        <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur px-3 py-1.5 rounded-xl text-[8px] font-black text-emerald-400">ROI ${gem.roi}%</div>
                    </div>
                    <h3 class="text-[11px] font-black truncate uppercase tracking-tighter mb-2 text-white/90">${gem.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-sm font-black text-rose-300 italic">${gem.price}€</span><span class="text-[8px] text-slate-600 font-black uppercase">${gem.sales} V/M</span></div>
                </div>`;
            });
        }
        function openDetails(asin) {
            const gem = allGems.find(g => g.asin === asin);
            if(!gem) return;
            activeGem = gem;
            document.getElementById('modalImg').src = gem.imageUrl;
            document.getElementById('modalName').innerText = gem.name;
            document.getElementById('modalAsin').innerText = gem.asin;
            document.getElementById('modalPrice').innerText = gem.price + "€";
            document.getElementById('modalRank').innerText = gem.rank || "#1,245";
            document.getElementById('modalSales').innerText = gem.sales + " / mois";
            document.getElementById('modalROI').innerText = gem.roi + "%";
            document.getElementById('modalMaxCost').innerText = gem.maxCost + "€";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + gem.asin.trim();
            document.getElementById('supplierLink').href = "https://www.alibaba.com/showroom/oem-manufacturer-" + gem.asin + ".html";
            updateSim();
            document.getElementById('dossierModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            if(!activeGem) return;
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('dossierModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function filterGems() {
            const q = document.getElementById('keywordSearch').value.toLowerCase();
            renderGrid(allGems.filter(g => g.name.toLowerCase().includes(q) || g.asin.toLowerCase().includes(q)));
        }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Dear Sourcing Manager, My name is Mr. HOMY from Worldshop. It MUST be identical to this model: Amazon Link: ${amzLink} ... Best regards, Mr. HOMY`;
            window.location.href = `mailto:mark@feyongusb.com?subject=Inquiry Worldshop&body=${encodeURIComponent(body)}`;
        }
        document.addEventListener('DOMContentLoaded', () => renderGrid(allGems));
    </script>
</body>
</html>
