<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Pro - Diamond Master 6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --vip-red: #ff3b30; --gold: #c5a059; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        .hero-banner { height: 320px; background: #000; position: relative; border-radius: 0 0 60px 60px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; filter: brightness(0.7) contrast(1.1); }
        .hero-title { font-size: 40px; font-weight: 900; color: #fff; line-height: 0.9; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; text-transform: uppercase; }
        
        .cat-pill { flex: 0 0 auto; padding: 12px 24px; background: #fff; border-radius: 25px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 2px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }

        .data-card { background: #fff; border-radius: 40px; padding: 28px; border: 5px solid #f2f2f2; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.05); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 25px; overflow: hidden; }
        .data-card:active { transform: scale(0.96); }
        
        .card-gaming { border-color: #0071e3; } 
        .card-auto { border-color: #ff9f0a; }   
        .card-cuisine { border-color: #34c759; } 
        .card-vip { border-color: #ff3b30; border-width: 6px; } 
        .card-euro { border-color: #5856d6; border-width: 6px; } 

        .asin-badge { font-size: 24px; font-weight: 900; color: #1d1d1f; letter-spacing: -1px; }
        .sales-badge { background: #f0fdf4; color: #166534; padding: 8px 16px; border-radius: 15px; font-size: 11px; font-weight: 900; }
        .fav-icon { position: absolute; top: 28px; right: 28px; font-size: 28px; color: #eee; transition: 0.3s; cursor: pointer; z-index: 20; }
        .fav-active { color: var(--vip-red) !important; }
        
        .action-btn { height: 60px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; font-weight: 900; text-transform: uppercase; transition: 0.2s; }
        .btn-amz { background: #000; color: #fff; flex: 1; }
        .btn-oem { background: #f5f5f7; color: #000; border: 1px solid #eee; flex: 1.5; }
        .btn-mail { background: #0071e3; color: #fff; width: 100%; margin-top: 18px; box-shadow: 0 12px 24px rgba(0, 113, 227, 0.3); }
        
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 85px; background: rgba(0,0,0,0.96); backdrop-filter: blur(30px); border-radius: 45px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .nav-item { color: #555; font-size: 26px; cursor: pointer; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-44">
    <div class="hero-banner">
        <img src="https://images.unsplash.com/photo-1523395211542-7c3ff17b544d?q=80&w=1200" class="hero-img">
        <div class="relative z-10">
            <p class="text-blue-400 text-[9px] font-black uppercase tracking-[0.5em] mb-3 italic">Worldshop Master Hub</p>
            <h1 class="hero-title">Sourcing<br>Machine.</h1>
        </div>
    </div>

    <div class="mt-8 px-6">
        <div class="flex gap-3 overflow-x-auto pb-6 no-scrollbar" id="catBar">
            <div class="cat-pill active" onclick="filterCat('all', this)">30 Pépites</div>
            <div class="cat-pill" style="background:#fee2e2" onclick="filterCat('VIP', this)"><i class="fas fa-crown"></i> Hub VIP (SSD/SD)</div>
            <div class="cat-pill" style="background:#e5e7eb" onclick="filterCat('EURO', this)"><i class="fas fa-euro-sign"></i> Destockeurs Europe</div>
            <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
            <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
            <div class="cat-pill" onclick="filterCat('Cuisine', this)">Cuisine</div>
        </div>
    </div>

    <div class="px-6 space-y-10" id="gemGrid"></div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-layer-group"></i></div>
        <div onclick="switchView('fav')" id="navFav" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item text-blue-400"><i class="fas fa-bolt"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        const allGems = [
            // DESTOCKEURS EUROPE (Hub Spécial)
            {"asin":"LDLC PRO","cat":"EURO","name":"LDLC Pro France - High-Tech Wholesaler","price":0,"sales":"PRO","buy":0,"vendor":"ldlc-pro.com"},
            {"asin":"IT-SCOPE","cat":"EURO","name":"IT-Scope EU - B2B IT Platform","price":0,"sales":"PRO","buy":0,"vendor":"itscope.com"},
            {"asin":"ALSO","cat":"EURO","name":"ALSO Cloud / Destockage Europe","price":0,"sales":"PRO","buy":0,"vendor":"also.com"},
            {"asin":"TECH DATA","cat":"EURO","name":"TD SYNNEX - Global Wholesaler","price":0,"sales":"PRO","buy":0,"vendor":"tdsynnex.com"},
            // HUB VIP (SAMSUNG/SANDISK/BRAUN)
            {"asin":"B0B7CKVCCV","cat":"VIP","name":"Samsung 990 PRO 1TB NVMe","price":119.00,"sales":3500,"buy":55.00,"vendor":"samsung-oem"},
            {"asin":"B09X7DNF6G","cat":"VIP","name":"SanDisk Extreme PRO 128GB","price":44.69,"sales":800,"buy":16.50,"vendor":"kissin"},
            {"asin":"B01BGOI9Z8","cat":"VIP","name":"Braun Series 9 Electric Shaver","price":179.00,"sales":1200,"buy":95.00,"vendor":"braun-distrib"},
            {"asin":"B0C8HHFX3C","cat":"VIP","name":"Kingston NV2 1TB SSD","price":75.00,"sales":1800,"buy":32.00,"vendor":"szjtcc"},
            // GAMING (>30€ UNIQUE)
            {"asin":"B0D3GZYN1P","cat":"Gaming","name":"RK Royal Kludge R75 Wireless","price":85.99,"sales":750,"buy":32.00,"vendor":"rkgaming"},
            {"asin":"B0GHVWHRBQ","cat":"Gaming","name":"Ajazz AK820 Pro Mechanical","price":82.99,"sales":500,"buy":35.00,"vendor":"ajazz"},
            {"asin":"B08DKS8W2Z","cat":"Gaming","name":"Quntis Computer Monitor Light","price":39.99,"sales":1100,"buy":14.50,"vendor":"highstar"},
            {"asin":"B0892D9F2G","cat":"Gaming","name":"Anker Soundcore Life Q30","price":79.99,"sales":1500,"buy":35.00,"vendor":"szlinx"},
            {"asin":"B0C8V49K6V","cat":"Gaming","name":"Link Dream Headphone Stand","price":34.50,"sales":890,"buy":12.00,"vendor":"linkdream"},
            // AUTO (>30€ UNIQUE)
            {"asin":"B07QC6BVVW","cat":"Auto","name":"Autel AP200 Bluetooth OBD2","price":69.00,"sales":600,"buy":31.00,"vendor":"autel"},
            {"asin":"B007XE8C74","cat":"Auto","name":"Autel AL319 OBD2 Engine Red","price":39.99,"sales":1200,"buy":14.00,"vendor":"autel"},
            {"asin":"B07QR4Q63Z","cat":"Auto","name":"AstroAI Air Compressor 150PSI","price":45.99,"sales":1800,"buy":18.00,"vendor":"yyliuyang"},
            {"asin":"B01IX6DC98","cat":"Auto","name":"Autel AL539B 3-in-1 Scanner","price":109.00,"sales":400,"buy":45.00,"vendor":"autel"},
            {"asin":"B07XJ1N4W2","cat":"Auto","name":"Favoto Motorcycle Cover XL","price":34.50,"sales":400,"buy":11.00,"vendor":"mei-ao"},
            // CUISINE (>30€ UNIQUE)
            {"asin":"B0113UZJE2","cat":"Cuisine","name":"Etekcity Digital Kitchen 5kg","price":32.70,"sales":500,"buy":12.00,"vendor":"vesync"},
            {"asin":"B088K8ZMXQ","cat":"Cuisine","name":"Salad Spinner 4-in-1 Pro","price":34.00,"sales":890,"buy":11.50,"vendor":"zgshuangma"},
            {"asin":"B0C8HHFX3D","cat":"Cuisine","name":"Sous Vide Stick Precision","price":75.00,"sales":1200,"buy":28.00,"vendor":"bonsen"},
            {"asin":"B07B4X8CWW","cat":"Cuisine","name":"Automatic Vacuum Sealer Pro","price":45.00,"sales":1400,"buy":18.00,"vendor":"bonsen"},
            {"asin":"B0C9G6X8M2","cat":"Cuisine","name":"Digital Food Dehydrator 5-Tray","price":59.99,"sales":600,"buy":22.00,"vendor":"hongmeihome"}
        ];
        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const isFav = favorites.includes(gem.asin);
                const colorMap = { 'Gaming': 'card-gaming', 'Auto': 'card-auto', 'Cuisine': 'card-cuisine', 'VIP': 'card-vip', 'EURO': 'card-euro' };
                grid.innerHTML += `<div class="data-card ${colorMap[gem.cat]}">
                    <i class="fas fa-heart fav-icon ${isFav?'fav-active':''}" onclick="toggleFav('${gem.asin}', this)"></i>
                    <div class="flex justify-between items-start mb-6">
                        <div><p class="asin-badge">${gem.asin}</p><p class="text-[12px] font-black text-slate-400 uppercase truncate w-48">${gem.name}</p></div>
                        <span class="sales-badge">${gem.sales} V/M</span>
                    </div>
                    ${gem.cat === 'EURO' ? `
                        <div class="flex gap-3">
                            <a href="https://${gem.vendor}" target="_blank" class="action-btn btn-mail" style="margin-top:0">Ouvrir Portail Grossiste Pro</a>
                        </div>
                    ` : `
                        <div class="grid grid-cols-2 gap-4 mb-6 bg-slate-50 p-5 rounded-3xl">
                            <div><p class="text-[9px] font-black text-slate-400 uppercase">Amazon.fr</p><p class="text-2xl font-black text-blue-600">${gem.price}€</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-400 uppercase">Achat Max</p><p class="text-2xl font-black text-emerald-600">${gem.buy}€</p></div>
                        </div>
                        <div class="flex gap-3">
                            <a href="https://www.amazon.fr/dp/${gem.asin}" target="_blank" class="action-btn btn-amz"><i class="fab fa-amazon text-lg"></i></a>
                            <a href="https://${gem.vendor}.en.alibaba.com/productlist.html" target="_blank" class="action-btn btn-oem">Showroom</a>
                        </div>
                        <button onclick="sendMail('${gem.asin}', '${gem.name}')" class="action-btn btn-mail">Email Worldshop Team (Julie)</button>
                    `}
                </div>`;
            });
        }
        function toggleFav(asin, el) {
            if(favorites.includes(asin)) favorites = favorites.filter(a => a !== asin);
            else favorites.push(asin);
            localStorage.setItem('ws_favs', JSON.stringify(favorites));
            el.classList.toggle('fav-active');
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function sendMail(asin, name) {
            const amzLink = `https://www.amazon.fr/dp/${asin}`;
            const body = `Dear Julie,\n\nThank you for your reply on Alibaba. To clarify: we are looking for BOTH options to compare:\n\n1. High Copy / OEM quality using original chipsets (the one we discussed to meet our price targets).\n2. 100% Original cards/products.\n\nProduct: ${name}\nASIN: ${asin}\nAmazon Link: ${amzLink}\n\nOur goal is to maintain a 30% margin based on our cost analysis, so competitive pricing for the OEM/High Copy with original chipsets is our priority for weekly volume (50-100 pcs).\n\nPlease also confirm the sample cost and lead time for a test batch.\n\nBest regards,\nWorldshop Team\nWhatsApp: +33664231515`;
            window.location.href = `mailto:julie@factory.com?subject=OEM Inquiry - ASIN ${asin}&body=${encodeURIComponent(body)}`;
        }
        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(view === 'home') { document.getElementById('navHome').classList.add('active'); renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO')); }
            if(view === 'fav') { document.getElementById('navFav').classList.add('active'); renderGrid(allGems.filter(g => favorites.includes(g.asin))); }
        }
        renderGrid(allGems.filter(g => g.cat !== 'VIP' && g.cat !== 'EURO'));
    </script>
</body>
</html>
