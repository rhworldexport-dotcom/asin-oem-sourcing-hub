        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .hero-header { background: #000; padding: 60px 24px 30px 24px; border-radius: 0 0 40px 40px; }
        .hero-title { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -1.5px; line-height: 1; }
        .cat-pill { flex: 0 0 auto; padding: 12px 20px; background: #fff; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1.5px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        .cat-pill.vip { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
        .data-card { background: #fff; border-radius: 28px; padding: 20px; border: 2.5px solid #f1f1f1; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.02); transition: 0.3s; }
        .card-gaming { border-color: #e0f2fe; } .card-auto { border-color: #fef3c7; } .card-cuisine { border-color: #d1fae5; } .card-vip { border-color: #fecaca; }
        .asin-badge { font-size: 18px; font-weight: 900; color: var(--apple-blue); letter-spacing: -0.5px; }
        .sales-badge { background: #f0fdf4; color: #166534; padding: 4px 10px; rounded-full; font-size: 10px; font-weight: 800; }
        .action-btn { height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
        .btn-amz { background: #000; color: #fff; flex: 1; } .btn-oem { background: #f5f5f7; color: #000; border: 1px solid #eee; flex: 1.2; }
        .btn-mail { background: var(--apple-blue); color: #fff; width: 100%; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; }
        .nav-item { color: #666; font-size: 22px; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const colorMap = { 'Gaming': 'card-gaming', 'Auto': 'card-auto', 'Cuisine': 'card-cuisine', 'VIP': 'card-vip' };
                grid.innerHTML += `<div class="data-card ${colorMap[gem.cat]}">
                    <div class="flex justify-between items-start mb-4">
                        <div><p class="asin-badge">${gem.asin}</p><p class="text-[9px] font-bold text-slate-400 uppercase truncate w-40">${gem.name}</p></div>

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function sendMail(asin, name) {
            const body = `Hello, This is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${asin} (${name}). Amazon Link: https://www.amazon.fr/dp/${asin}. Best regards, Mr. HOMY (+33642131515)`;
