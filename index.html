<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Pro - Supreme Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --sa-green: #27ae60; --sandisk-red: #ff3b30; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        /* Banner Dynamique Style Apple */
        .hero-banner { height: 260px; background: #000; position: relative; border-radius: 0 0 50px 50px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; filter: contrast(1.2) brightness(0.8); }
        .hero-title { font-size: 36px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -1.5px; position: relative; z-index: 10; font-style: italic; }
        
        .cat-pill { flex: 0 0 auto; padding: 12px 22px; background: #fff; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1.5px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); }
        .cat-pill.vip { background: #fee2e2; border-color: #fecaca; color: #991b1b; }

        /* Cartes Data avec Contours Accentues */
        .data-card { background: #fff; border-radius: 35px; padding: 24px; border: 3px solid #f1f1f1; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.03); transition: 0.3s; }
        .card-gaming { border-color: #e0f2fe; } /* Bleu */
        .card-auto { border-color: #fef3c7; }    /* Orange */
        .card-cuisine { border-color: #d1fae5; } /* Vert */
        .card-vip { border-color: #fecaca; border-width: 4px; } /* Rouge VIP */
        
        .asin-badge { font-size: 20px; font-weight: 900; color: var(--apple-blue); letter-spacing: -0.5px; }
        .sales-badge { background: #f0fdf4; color: #166534; padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; }
        
        .action-btn { height: 50px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; transition: 0.2s; }
        .btn-amz { background: #000; color: #fff; flex: 1; }
        .btn-oem { background: #f5f5f7; color: #000; border: 1px solid #eee; flex: 1.5; }
        .btn-mail { background: var(--apple-blue); color: #fff; width: 100%; margin-top: 12px; box-shadow: 0 10px 20px rgba(0, 113, 227, 0.2); }
        
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 80px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 40px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .nav-item { color: #666; font-size: 24px; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">
    <div class="hero-banner">
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800&q=80" class="hero-img">
        <div class="relative z-10">
            <span class="bg-blue-600 text-white text-[8px] font-black px-3 py-1 rounded-full uppercase mb-4 inline-block tracking-widest italic">Worldshop Strategy</span>
            <h1 class="hero-title">Sourcing<br><span style="color:var(--apple-blue)">Elite Master.</span></h1>
        </div>
    </div>

    <div class="mt-8 px-6">
        <div class="flex gap-3 overflow-x-auto pb-6 no-scrollbar" id="catBar">
            <div class="cat-pill active" onclick="filterCat('all', this)">30 Pépites Mix</div>
            <div class="cat-pill vip" onclick="filterCat('VIP', this)"><i class="fas fa-crown"></i> Hub VIP (10)</div>
            <div class="cat-pill" onclick="filterCat('Gaming', this)">Gaming</div>
            <div class="cat-pill" onclick="filterCat('Auto', this)">Auto</div>
            <div class="cat-pill" onclick="filterCat('Cuisine', this)">Cuisine</div>
        </div>
    </div>

    <div class="px-6 space-y-8" id="gemGrid"></div>

    <nav class="nav-bar">
        <div onclick="switchView('home')" id="navHome" class="nav-item active"><i class="fas fa-layer-group"></i></div>
        <div onclick="switchView('fav')" class="nav-item"><i class="fas fa-heart"></i></div>
        <div onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="nav-item text-blue-400"><i class="fas fa-bolt"></i></div>
        <div class="nav-item"><i class="fas fa-user-circle"></i></div>
    </nav>

        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                const colorMap = { 'Gaming': 'card-gaming', 'Auto': 'card-auto', 'Cuisine': 'card-cuisine', 'VIP': 'card-vip' };
                grid.innerHTML += `<div class="data-card ${colorMap[gem.cat]}">
                    <div class="flex justify-between items-start mb-4">
                        <div><p class="asin-badge">${gem.asin}</p><p class="text-[10px] font-extrabold text-slate-500 uppercase truncate w-48">${gem.name}</p></div>
                        <span class="sales-badge">${gem.sales} V/M</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-5 bg-slate-50 p-4 rounded-2xl">
                        <div><p class="text-[8px] font-black text-slate-400 uppercase">Prix Amazon</p><p class="text-xl font-black text-blue-600">${gem.price}€</p></div>
                        <div class="text-right"><p class="text-[8px] font-black text-slate-400 uppercase">Achat Direct</p><p class="text-xl font-black text-emerald-600">${gem.buy}€</p></div>
                    </div>
                    <div class="flex gap-2">
                        <a href="https://www.amazon.fr/dp/${gem.asin}" target="_blank" class="action-btn btn-amz"><i class="fab fa-amazon text-sm"></i></a>
                        <a href="https://${gem.vendor}.en.alibaba.com/productlist.html" target="_blank" class="action-btn btn-oem">Showroom OEM <i class="fas fa-external-link-alt ml-1"></i></a>
                    </div>
                    <button onclick="sendMail('${gem.asin}', '${gem.name}')" class="action-btn btn-mail">Email Worldshop Strategy</button>
                </div>`;
            });
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function sendMail(asin, name) {
            const body = `Hello, This is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${asin} (${name}). Amazon Link: https://www.amazon.fr/dp/${asin}. WhatsApp: +33642131515. Best regards.`;
            window.location.href = `mailto:sales@factory.com?subject=OEM Inquiry - ASIN ${asin}&body=${encodeURIComponent(body)}`;
        }
        function switchView(view) { if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'VIP')); }
        renderGrid(allGems.filter(g => g.cat !== 'VIP'));
    </script>
</body>
</html>
