<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Worldshop Elite - Sourcing Supreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --apple-blue: #0071e3; --vip-red: #ff3b30; }
        body { background-color: #fbfbfd; color: #1d1d1f; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .hero-header { height: 280px; background: #000; position: relative; border-radius: 0 0 60px 60px; display: flex; align-items: flex-end; padding: 40px 30px; overflow: hidden; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; filter: contrast(1.1); }
        .hero-title { font-size: 42px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -2px; position: relative; z-index: 10; font-style: italic; }
        .cat-pill { flex: 0 0 auto; padding: 12px 24px; background: #fff; border-radius: 25px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: 1.5px solid #eee; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .cat-pill.active { background: #000; color: #fff; border-color: #000; transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .cat-pill.vip { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
        .gem-card { background: #ffffff; border-radius: 35px; padding: 22px; border: 2px solid #f1f1f1; position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .gem-card:active { transform: scale(0.95); border-color: var(--apple-blue); }
        .img-wrap { height: 140px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 15px; border-radius: 20px; overflow: hidden; }
        .product-img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .modal-view { position: fixed; inset: 0; background: white; z-index: 5000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .modal-active { transform: translateY(0); }
        .nav-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 38px; display: flex; justify-content: space-around; align-items: center; z-index: 4000; }
        .nav-item { color: #666; font-size: 24px; } .nav-item.active { color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">

            </div>
        </div>

            <div class="flex justify-between py-4 border-b"><span class="text-xs font-bold text-slate-500 uppercase">Ventes/Mois</span><span id="modalSales" class="font-black text-emerald-600">---</span></div>
            <div class="flex justify-between py-4"><span class="text-xs font-bold text-slate-500 uppercase">ROI Garanti</span><span id="modalROI" class="font-black text-green-600 text-lg">50%+</span></div>
        </div>
        <div class="bg-black text-white rounded-[40px] p-8 mb-8 shadow-2xl">
            <div class="grid grid-cols-2 gap-6 mb-8">
                <div><p class="text-[8px] font-bold text-slate-500 uppercase mb-2">Quantité</p><input type="number" id="simQty" value="100" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-xl p-3 text-center font-black"></div>
                <div><p class="text-[8px] font-bold text-slate-500 uppercase mb-2">Achat €</p><input type="number" id="simBuyPrice" value="5.00" step="0.1" oninput="updateSim()" class="w-full bg-white/10 border-none rounded-xl p-3 text-center font-black text-emerald-400"></div>
            </div>
            <div class="flex justify-between items-end">
                <div><p class="text-[8px] font-bold text-slate-500 mb-1 uppercase">C.A RECAP</p><p id="simCA" class="text-2xl font-black italic">--€</p></div>
                <div class="text-right"><p class="text-[8px] font-bold text-emerald-400 mb-1 uppercase">PROFIT NET</p><p id="simProfit" class="text-3xl font-black text-emerald-400 italic">--€</p></div>
            </div>
        </div>
        <button onclick="prepareDirectEmail()" class="w-full h-22 rounded-[35px] bg-blue-600 text-white font-black text-sm uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Lancer Stratégie Worldshop</button>

    </nav>

            // HUB VIP (SSD/SD)
            {"asin":"B0B7NTY2S6","cat":"VIP","name":"SanDisk Ultra 128GB SD","price":24.99,"sales":2500,"rank":2,"imageUrl":"https://m.media-amazon.com/images/I/71Ow-Ih7KNL.jpg","vendor":"iotech"},
            {"asin":"B0C8HHFX3C","cat":"VIP","name":"Kingston NV2 1TB SSD","price":75.00,"sales":1800,"rank":215,"imageUrl":"https://m.media-amazon.com/images/I/516+2Z7S2cL.jpg","vendor":"iotech"},
            {"asin":"B099684C5G","cat":"VIP","name":"Samsung 990 PRO 1TB SSD","price":115.00,"sales":3500,"rank":1,"imageUrl":"https://m.media-amazon.com/images/I/616684C5G.jpg","vendor":"samsung-oem"},
            {"asin":"B0DCW8FKK9","cat":"VIP","name":"SanDisk Ultra Go Dual","price":26.99,"sales":1000,"rank":2,"imageUrl":"https://m.media-amazon.com/images/I/71UkwcNaIvL.jpg","vendor":"iotech"},

        ];
        let activeGem = null;
        let favorites = JSON.parse(localStorage.getItem('ws_favs') || '[]');
        function renderGrid(data) {
            const grid = document.getElementById('gemGrid'); grid.innerHTML = '';
            data.forEach((gem) => {
                grid.innerHTML += `<div class="gem-card animate-reveal" onclick="openDetails('${gem.asin}')">
                    <div class="img-wrap"><img src="${gem.imageUrl}" class="product-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589174.png'"></div>
                    <h3 class="text-[10px] font-black text-slate-400 truncate mb-1 uppercase">${gem.name}</h3>
                    <div class="flex justify-between items-center"><span class="text-[18px] font-black text-blue-600">${gem.price}€</span><span class="text-[8px] bg-slate-50 px-2 py-1 rounded-md font-bold text-slate-400">${gem.sales} V/M</span></div>
                </div>`;
            });
        }
        function filterCat(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active')); el.classList.add('active');
            if(cat === 'all') renderGrid(allGems.filter(g => g.cat !== 'VIP'));
            else renderGrid(allGems.filter(g => g.cat === cat));
        }
        function openDetails(asin) {
            activeGem = allGems.find(g => g.asin === asin); if(!activeGem) return;
            document.getElementById('modalImg').src = activeGem.imageUrl;
            document.getElementById('modalName').innerText = activeGem.name;
            document.getElementById('modalAsin').innerText = activeGem.asin;
            document.getElementById('modalPrice').innerText = activeGem.price + "€";
            document.getElementById('modalSales').innerText = activeGem.sales + " / mois";
            document.getElementById('amazonLink').href = "https://www.amazon.fr/dp/" + activeGem.asin;
            document.getElementById('supplierLink').href = "https://" + activeGem.vendor + ".en.alibaba.com/productlist.html";
            updateSim(); document.getElementById('detailsModal').classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }
        function updateSim() {
            const qty = parseFloat(document.getElementById('simQty').value) || 0;
            const buy = parseFloat(document.getElementById('simBuyPrice').value) || 0;
            const sell = parseFloat(activeGem.price);
            document.getElementById('simCA').innerText = (sell * qty).toFixed(2) + "€";
            document.getElementById('simProfit').innerText = ((sell - buy) * qty).toFixed(2) + "€";
        }
        function closeModal() { document.getElementById('detailsModal').classList.remove('modal-active'); document.body.style.overflow = 'auto'; }
        function switchView(view) { if(view === 'home') renderGrid(allGems.filter(g => g.cat !== 'VIP')); }
        function prepareDirectEmail() {
            const amzLink = "https://www.amazon.fr/dp/" + activeGem.asin;
            const body = `Hello, This is Mr. HOMY from Worldshop. I need OEM supply for ASIN ${activeGem.asin}. Best regards, Mr. HOMY (+33642131515)`;
            window.location.href = `mailto:sales@factory.com?subject=OEM Inquiry - ASIN ${activeGem.asin}&body=${encodeURIComponent(body)}`;
        }
        renderGrid(allGems.filter(g => g.cat !== 'VIP'));
    </script>
